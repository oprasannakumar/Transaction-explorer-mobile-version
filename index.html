/* ACCOUNT SELECTION WITH DATE FILTER INTEGRATION */
async function filterLedgerByEntity(type, query) {
    if (!globalDataCache) return;
    currentTableMode = 'statement';
    setProcessing(true, `Filtering ${query}...`);

    try {
        const fullStatementData = globalDataCache.sheets["Full Statement"];
        const ledgerHeaders = fullStatementData.headers;
        
        const transIdx = ledgerHeaders.findIndex(h => h.toLowerCase().includes('transaction'));
        let entityIdx = ledgerHeaders.findIndex(h => h.toLowerCase().includes('from/'));
        if (entityIdx === -1) entityIdx = ledgerHeaders.findIndex(h => h.toLowerCase().includes('account'));
        
        const qLower = query.toLowerCase().trim();
        
        const matchedRows = fullStatementData.rows.filter(row => {
            const transType = transIdx !== -1 && row[transIdx] ? String(row[transIdx]).toLowerCase().trim() : "";
            const entity = entityIdx !== -1 && row[entityIdx] ? String(row[entityIdx]).toLowerCase().trim() : "";

            if (type === "Savings") {
                if (qLower.includes("cash")) return entity.includes("cash");
                const isAllowedTrans = transType.includes("upi") || transType.includes("debit") || transType.includes("net");
                return isAllowedTrans && (entity === qLower);
            } 
            else if (type === "CC") {
                const isCredit = transType.includes("credit");
                if (qLower.includes("hdfc")) return isCredit && entity.includes("hdfc"); 
                if (qLower.includes("icici amazon")) return isCredit && entity.includes("icici amazon");
                if (qLower.includes("icici")) return isCredit && (entity.includes("icici expressions") || entity.includes("icici coral"));
                if (qLower.includes("axis")) return isCredit && (entity.includes("axis flipkart") || entity.includes("axis neo") || entity.includes("axis myzone"));
                return isCredit && (entity === qLower);
            }
            return false;
        });

        const s = selectedStart;
        const e = selectedEnd;

        if (type === "Savings") {
            const openingBalance = await fetchOpeningBalance(query); 
            const sortedRows = sortRowsByDate(ledgerHeaders, matchedRows);
            const enhanced = injectRunningBalance(ledgerHeaders, sortedRows, openingBalance);
            
            let displayRows = enhanced.rows;
            if (s && e) {
                displayRows = filterRowsLocallyByDate(enhanced.headers, displayRows, s, e);
            }
            renderTable(enhanced.headers, displayRows);
            updateToolbarMetrics(enhanced.headers, displayRows);
        } else {
            let displayRows = matchedRows;
            if (s && e) {
                displayRows = filterRowsLocallyByDate(ledgerHeaders, displayRows, s, e);
            }
            renderTable(ledgerHeaders, displayRows);
            updateToolbarMetrics(ledgerHeaders, displayRows);
        }
        setProcessing(false);
    } catch (e) {
        setProcessing(false);
    }
}

async function fetchOpeningBalance(accountName) {
    if (!globalDataCache) return 0;
    const openingsData = globalDataCache.namedRanges?.ActualOpenings;
    if (!openingsData || !openingsData.rows) return 0;
    const row = openingsData.rows.find(r => 
        String(r[0]).trim().toLowerCase() === String(accountName).trim().toLowerCase()
    );
    return row ? (parseFloat(row[1]) || 0) : 0; 
}


function injectRunningBalance(headers, rows, openingBalance) {
    const depositIdx = headers.findIndex(h => /deposit/i.test(h));
    const withdrawnIdx = headers.findIndex(h => /withdrawn/i.test(h));
    const refIdx = headers.findIndex(h => /reference/i.test(h));

    if (depositIdx === -1 || withdrawnIdx === -1) return { headers, rows };

    let running = openingBalance;
    const newHeaders = [...headers];
    const insertPosition = refIdx !== -1 ? refIdx : depositIdx + 1;
    newHeaders.splice(insertPosition, 0, "Running Balance");

    const newRows = rows.map((row, index) => {
        const deposit = parseFloat((row[depositIdx] || "0").toString().replace(/[^0-9.-]/g, "")) || 0;
        const withdrawn = parseFloat((row[withdrawnIdx] || "0").toString().replace(/[^0-9.-]/g, "")) || 0;
        running = (index === 0 ? openingBalance : running) + deposit - withdrawn;

        const newRow = [...row];
        running = Math.round((running + Number.EPSILON) * 100) / 100;
        newRow.splice(insertPosition, 0, running);
        return newRow;
    });

    return { headers: newHeaders, rows: newRows };
}

function updateToolbarMetrics(headers, rows) {
    const inflowEl = document.getElementById('bar-inflow');
    const outflowEl = document.getElementById('bar-outflow');
    if (!inflowEl || !outflowEl) return;

    let inflow = 0, outflow = 0;
    const headerLower = headers.map(h => h.toLowerCase());
    const inflowIndexes = headerLower.map((h, i) => /deposit|received|credit|incoming/.test(h) ? i : -1).filter(i => i !== -1);
    const outflowIndexes = headerLower.map((h, i) => /withdrawn|given|debit|paid|expense/.test(h) ? i : -1).filter(i => i !== -1);

    rows.forEach(row => {
        inflowIndexes.forEach(i => { inflow += parseFloat((row[i] || "0").toString().replace(/[^0-9.-]/g, "")) || 0; });
        outflowIndexes.forEach(i => { outflow += parseFloat((row[i] || "0").toString().replace(/[^0-9.-]/g, "")) || 0; });
    });

    inflowEl.innerText = formatINR(inflow);
    outflowEl.innerText = formatINR(outflow);
}

function formatTacticalDate(dateStr) {
    if (!dateStr) return "-";
    const date = new Date(dateStr);
    if (isNaN(date)) return dateStr; 
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return `${date.getDate()}-${months[date.getMonth()]}-${date.getFullYear()}`;
}

function setProcessing(isProcessing, message = "LOADING...") {
    const overlay = document.getElementById('processing-overlay');
    const overlayText = document.getElementById('overlay-text');
    if (isProcessing) {
        overlay.style.display = 'flex';
        overlayText.innerText = message.toUpperCase();
    } else {
        overlay.style.display = 'none';
    }
}

function sortRowsByDate(headers, rows) {
    const dateIndex = headers.findIndex(h => /date/i.test(h));
    if (dateIndex === -1) return rows;
    return rows.sort((a, b) => parseDateValue(a[dateIndex]) - parseDateValue(b[dateIndex]));
}

function formatINR(value) {
    if (value === null || value === undefined || value === "") return "";
    const num = parseFloat(value.toString().replace(/[^0-9.-]/g, ""));
    if (isNaN(num)) return value;
    return "₹" + num.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderTable(headers, rows) {
    toggleDashboard(false);
    document.querySelectorAll('.toolbar-row').forEach(row => row.style.display = 'flex');
    document.getElementById('trace-toolbar-controls').style.display = 'none';
    document.getElementById('vault-toolbar-controls').style.display = 'none';
    document.getElementById('table-toolbar-controls').style.display = 'flex';
    document.getElementById('tableFilter').value = "";
    
    activeFilters = {};
    globalRawHeaders = headers; globalRawRows = rows; rows = sortRowsByDate(headers, rows);
    const isRegistry = currentTableMode === 'registry';
    let idColIdx = headers.findIndex(h => /id|ref_id|reference/i.test(h));
    if (idColIdx === -1) idColIdx = headers.length - 1;

    let html = `
      <div class='sheet-card'>
        <div class='table-wrap' id="tableWrap">
           <table id="mainDataTable">
                <thead>
                    <tr>
                        ${headers.map((h) => {
                            const fieldName = h.toLowerCase().replace(/\s+/g, '_');
                            return `
                            <th onclick="openFilterModal('${fieldName}', '${h}')">
                                ${h} ▼
                            </th>`;
                        }).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${rows.map(row => {
                        const rawId = row[idColIdx];
                        const rowId = rawId ? String(rawId).trim() : "";
                        return `
                        <tr class="data-row" data-id="${rowId}" onclick="handleRowClick(this)">
                            ${row.map((cell, idx) => {
                                const headerName = headers[idx].toLowerCase();
                                const fieldName = headerName.replace(/\s+/g, '_');
                                const isIdCol = idx === idColIdx;
                                const isDate = /date/i.test(headers[idx]);

                                const isInflow = /deposit|received|credit|incoming/.test(headerName);
                                const isOutflow = /withdrawn|given|debit|paid|expense/.test(headerName);
                                const isRunningBalance = headerName.includes("running balance");
                                const isAmount = isInflow || isOutflow || headerName.includes("total") || (headerName.includes("balance") && !isRunningBalance);

                                let content = cell ?? '';
                                if (isAmount) content = formatINR(cell);
                                if (isIdCol && !isRegistry) content = `<span class="id-badge">${cell}</span>`;
                                else if (isDate) content = formatTacticalDate(cell);

                                let amountStyle = "";
                                if (isRunningBalance) amountStyle = "color:var(--ledger); font-weight:800;";
                                else if (isInflow) amountStyle = "color:var(--success); font-weight:700;";
                                else if (isOutflow) amountStyle = "color:var(--danger); font-weight:700;";

                                return `<td data-field="${fieldName}" style="${amountStyle}">${content}</td>`;
                            }).join('')}
                        </tr>`;
                    }).join('')}
                </tbody>
           </table>
        </div>
    </div>`;

    document.getElementById('displayArea').innerHTML = html;
    recalculateMetricsFromVisible();
}

function handleRowClick(rowElement) {
    rowElement.classList.toggle('selected');
    recalculateMetricsFromSelected();
}

function openFilterModal(fieldName, titleName) {
    activeModalField = fieldName;
    document.getElementById('filter-modal-title').innerText = `Filter: ${titleName}`;
    document.getElementById('filter-search-input').value = "";
    
    const colIndex = globalRawHeaders.findIndex(h => h.toLowerCase().replace(/\s+/g, '_') === fieldName);
    const isDateColumn = /date/i.test(globalRawHeaders[colIndex] || "");
    
    const valueSet = new Set();
    if (colIndex !== -1) {
        globalRawRows.forEach(row => {
            let rawValue = (row[colIndex] ?? "").toString().trim();
            if (rawValue !== "") valueSet.add(rawValue);
        });
    }

    const sorted = Array.from(valueSet).sort((a, b) => {
        if (isDateColumn) {
            return parseDateValue(a) - parseDateValue(b);
        }
        if (!isNaN(a) && !isNaN(b)) return parseFloat(a) - parseFloat(b);
        return a.localeCompare(b);
    });

    const selected = activeFilters[fieldName] || [];
    const container = document.getElementById('modal-options-container');
    
    container.innerHTML = sorted.map(val => `
        <div class="filter-option ${selected.includes(normalizeValue(val)) ? 'selected' : ''}" data-value="${val}" onclick="toggleModalOptionChip(this)">
            <span>${val}</span>
        </div>
    `).join('');

    document.getElementById('global-filter-modal').classList.add('open');
}

function closeFilterModal(e) {
    if (!e || e.target.id === 'global-filter-modal' || e.target.tagName === 'BUTTON') {
        document.getElementById('global-filter-modal').classList.remove('open');
    }
}

function filterColumnOptions(query) {
    query = query.toLowerCase().trim();
    const options = document.querySelectorAll('#modal-options-container .filter-option');
    options.forEach(opt => {
        const val = opt.getAttribute('data-value').toLowerCase();
        opt.style.display = (!query || val.includes(query)) ? 'flex' : 'none';
    });
}

function toggleModalOptionChip(element) {
    element.classList.toggle('selected');
}

function selectAllModalOptions() {
    const options = document.querySelectorAll('#modal-options-container .filter-option');
    options.forEach(opt => {
        if (opt.style.display !== 'none') {
            opt.classList.add('selected');
        }
    });
}

function confirmModalFilter() {
    if (!activeModalField) return;
    const selectedChips = document.querySelectorAll('#modal-options-container .filter-option.selected');
    const allChips = document.querySelectorAll('#modal-options-container .filter-option');

    if (selectedChips.length === 0 || selectedChips.length === allChips.length) {
        activeFilters[activeModalField] = [];
    } else {
        activeFilters[activeModalField] = Array.from(selectedChips).map(c => normalizeValue(c.getAttribute('data-value')));
    }

    applyFilters();
    closeFilterModal();
}

function clearModalFilter() {
    if (!activeModalField) return;
    activeFilters[activeModalField] = [];
    applyFilters();
    closeFilterModal();
}

function resetAllFilters() {
    activeFilters = {};
    document.getElementById('tableFilter').value = "";
    applyFilters();
}

function applyFilters() {
    const query = document.getElementById('tableFilter').value.toLowerCase().trim();
    const rows = Array.from(document.querySelectorAll('.data-row'));

    rows.forEach(row => {
        const cells = Array.from(row.querySelectorAll('td'));
        const matchesSearch = !query || cells.some(c => c.textContent.toLowerCase().includes(query));
        let matchesFilters = true;

        for (const field in activeFilters) {
            const selectedValues = activeFilters[field];
            if (!selectedValues || selectedValues.length === 0) continue;
            const cell = row.querySelector(`td[data-field="${field}"]`);
            if (!cell || !selectedValues.includes(normalizeValue(cell.textContent))) {
                matchesFilters = false; break;
            }
        }

        row.style.display = (matchesSearch && matchesFilters) ? "" : "none";
    });

    recalculateMetricsFromVisible();
}

function recalculateMetricsFromVisible() {
    const rows = Array.from(document.querySelectorAll('#mainDataTable tbody tr'));
    let totalInflow = 0, totalOutflow = 0;

    rows.forEach(row => {
        if (row.style.display !== 'none') {
            const inflowCell = row.querySelector('td[style*="color:var(--success)"]');
            const outflowCell = row.querySelector('td[style*="color:var(--danger)"]');
            if (inflowCell) totalInflow += parseFloat(inflowCell.innerText.replace(/[^0-9.-]/g, "")) || 0;
            if (outflowCell) totalOutflow += parseFloat(outflowCell.innerText.replace(/[^0-9.-]/g, "")) || 0;
        }
    });

    document.getElementById('bar-inflow').innerText = formatINR(totalInflow);
    document.getElementById('bar-outflow').innerText = formatINR(totalOutflow);
}

function recalculateMetricsFromSelected() {
    const selectedRows = document.querySelectorAll('.data-row.selected');
    if (selectedRows.length === 0) return recalculateMetricsFromVisible();
    let totalInflow = 0, totalOutflow = 0;

    selectedRows.forEach(row => {
        const inflowCell = row.querySelector('td[style*="color:var(--success)"]');
        const outflowCell = row.querySelector('td[style*="color:var(--danger)"]');
        if (inflowCell) totalInflow += parseFloat(inflowCell.innerText.replace(/[^0-9.-]/g, "")) || 0;
        if (outflowCell) totalOutflow += parseFloat(outflowCell.innerText.replace(/[^0-9.-]/g, "")) || 0;
    });

    document.getElementById('bar-inflow').innerText = formatINR(totalInflow);
    document.getElementById('bar-outflow').innerText = formatINR(totalOutflow);
}

async function fetchAssociated() {
    if (!globalDataCache) return;
    toggleDashboard(false);

    const ids = Array.from(document.querySelectorAll('.data-row.selected')).map(r => r.getAttribute('data-id'));
    if (!ids.length) return;
    setProcessing(true, "TRACING SYSTEM REFERENCES...");

    // Hide dashboard, standard toolbar rows & other controls
    document.querySelectorAll('.toolbar-row').forEach(row => row.style.display = 'none');
    document.getElementById('table-toolbar-controls').style.display = 'none';
    document.getElementById('vault-toolbar-controls').style.display = 'none';
    
    // Show only Back and Logout controls
    document.getElementById('trace-toolbar-controls').style.display = 'flex';

    try {
        let grouped = {};
        for (const [sheetName, data] of Object.entries(globalDataCache.sheets)) {
            const matchedRows = data.rows.filter(row => row.some(cell => ids.includes(String(cell).trim())));
            if (matchedRows.length > 0) {
                grouped[sheetName] = { headers: data.headers, rows: matchedRows };
            }
        }

        let finalHtml = ""; // Banner removed completely
        let foundAnyData = false;

        for (const sheetName in grouped) {
            const sheet = grouped[sheetName];
            if (sheet.headers && sheet.rows && sheet.rows.length > 0) {
                foundAnyData = true;
                finalHtml += `
                    <div class="sheet-card" style="margin-bottom:14px;">
                        <div style="padding:10px; background:rgba(14,165,233,0.1); border-bottom:1px solid var(--border); font-size:11px; font-weight:800; color:var(--primary);">
                            MODULE: ${sheetName.toUpperCase()} (${sheet.rows.length})
                        </div>
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>${sheet.headers.map(h => `<th>${h}</th>`).join('')}</tr>
                                </thead>
                                <tbody>
                                    ${sheet.rows.map(r => `
                                        <tr>${r.map((cell, idx) => {
                                                const isDate = /date/i.test(sheet.headers[idx]);
                                                const isAmount = /amount|total|balance|deposit|withdrawn/i.test(sheet.headers[idx]);
                                                return `<td style="${isAmount ? 'font-family:\'JetBrains Mono\'; font-weight:700; color:var(--gold);' : ''}">
                                                            ${isDate ? formatTacticalDate(cell) : (cell ?? "")}
                                                        </td>`;
                                            }).join('')}
                                        </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>`;
            }
        }

        if (!foundAnyData) {
            finalHtml += `<div style="text-align:center; padding:40px; color:var(--text-muted); font-size:12px;">NO ASSOCIATED RECORDS FOUND</div>`;
        }

        document.getElementById('displayArea').innerHTML = finalHtml;
        setProcessing(false);
        document.getElementById('status').innerText = "TRACE_COMPLETE";
        
    } catch(e) { 
        setProcessing(false);
        document.getElementById('status').innerText = "TRACE_ERROR";
    }
}


let longPressTimer;
function showContextMenu(e, rowElement) {
    if (e.cancelable) e.preventDefault();
    if (!rowElement.classList.contains('selected')) {
        document.querySelectorAll('.data-row.selected').forEach(r => r.classList.remove('selected'));
        handleRowClick(rowElement);
    }

    const menu = document.getElementById('custom-context-menu');
    const selectedCount = document.querySelectorAll('.data-row.selected').length;
    
    let menuHtml = ``;
    if (selectedCount === 1) {
        menuHtml += `<div class="menu-item" onclick="executeCommand('copy')">📋 Copy Details</div>
                     <div class="menu-item" onclick="executeCommand('edit')">✏️ Edit Record</div>`;
    }
    menuHtml += `<div class="menu-item" onclick="executeCommand('trace')">🔍 Trace Sequence (${selectedCount})</div>
                 <div class="menu-item danger" onclick="executeCommand('purge')">🔥 Global Purge (${selectedCount})</div>
                 <div class="menu-item" onclick="hideContextMenu()">❌ Cancel</div>`;
    menu.innerHTML = menuHtml;
    menu.style.display = 'block';

    document.addEventListener('click', hideContextMenu);
}

function hideContextMenu() {
    document.getElementById('custom-context-menu').style.display = 'none';
    document.removeEventListener('click', hideContextMenu);
}

async function executeCommand(type) {
    hideContextMenu();
    const selectedRows = document.querySelectorAll('.data-row.selected');
    if (type === 'copy' && selectedRows.length === 1) copyRowToClipboard(selectedRows[0]);
    else if (type === 'edit' && selectedRows.length === 1) openEditModal(selectedRows[0]);
    else if (type === 'trace') fetchAssociated();
    else if (type === 'purge') deleteRecords();
}
window.addEventListener('click', (e) => {
    if (!e.target.closest('.custom-select-wrapper')) {
        document.querySelectorAll('.custom-select-wrapper').forEach(el => el.classList.remove('open'));
    }
});

document.addEventListener('touchstart', function(e) {
    const row = e.target.closest('.data-row');
    if (row) longPressTimer = setTimeout(() => showContextMenu(e, row), 550);
}, {passive: false});

document.addEventListener('touchend', () => clearTimeout(longPressTimer));
document.addEventListener('touchmove', () => clearTimeout(longPressTimer));

/* DEEP CACHE PURGE & FORCE DEPLOYMENT RELOAD */
async function forceAppReload() {
    setProcessing(true, "PURGING CACHE & RELOADING...");
    
    // 1. Clear LocalStorage JSON Cache
    localStorage.removeItem("finance_data_cache_v3");

    // 2. Clear all PWA Cache Storage
    if ('caches' in window) {
        try {
            const keys = await caches.keys();
            await Promise.all(keys.map(key => caches.delete(key)));
        } catch(e) { console.warn("Cache API clear failed:", e); }
    }

    // 3. Unregister active Service Workers
    if ('serviceWorker' in navigator) {
        try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let registration of registrations) {
                await registration.unregister();
            }
        } catch(e) { console.warn("ServiceWorker unregister failed:", e); }
    }

    // 4. Force hard reload with timestamp parameter
    const currentUrl = new URL(window.location.href);
    currentUrl.searchParams.set('_v', Date.now());
    window.location.href = currentUrl.toString();
}



async function copyRowToClipboard(rowElement) {
    const table = document.getElementById('mainDataTable');
    const headers = Array.from(table.querySelectorAll('th')).map(th => th.innerText.replace('▼', '').trim());
    const cells = Array.from(rowElement.querySelectorAll('td')).map(td => td.innerText.trim());

    const getVal = (regex) => {
        const idx = headers.findIndex(h => regex.test(h));
        return idx !== -1 ? cells[idx] : "";
    };

    const date = getVal(/date/i);
    const narration = getVal(/narration/i);
    const spentFor = getVal(/spent for/i);
    const withdrawn = getVal(/withdrawn amount/i).replace(/[^0-9.]/g, "");
    const deposit = getVal(/deposit amount/i).replace(/[^0-9.]/g, "");
    const account = getVal(/from\/ to/i);
    const ref = getVal(/reference/i);

    const isDebit = parseFloat(withdrawn) > 0;
    const amount = isDebit ? withdrawn : deposit;
    const type = isDebit ? "Debit" : "Credit";

    const formattedText = `📅 Date: ${date}\n👤 Name: ${spentFor}\n📝 Msg: ${narration}\n💰 Amount: ${amount}\n⇄ Type: ${type}\n🏢 Account: ${account}\n🔗 Ref: ${ref}`;

    try {
        await navigator.clipboard.writeText(formattedText);
        alert("Copied to clipboard!");
    } catch (err) {
        alert("Copy failed.");
    }
}

async function deleteRecords() {
    const ids = Array.from(document.querySelectorAll('.data-row.selected')).map(r => r.getAttribute('data-id'));
    const token = sessionStorage.getItem("session_token");
    if (!ids.length || !confirm(`PURGE ${ids.length} records?`)) return;

    setProcessing(true, "PURGING...");
    try {
        await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'deleteRows', ids: ids, token: token })
        });
        setTimeout(() => syncAllData(true), 1200);
    } catch(e) { 
        setProcessing(false);
    }
}

function openEditModal(rowElement) {
    const table = document.getElementById('mainDataTable');
    const headers = Array.from(table.querySelectorAll('th')).map(th => th.innerText.replace('▼', '').trim());
    const cells = Array.from(rowElement.querySelectorAll('td')).map(td => td.innerText.trim());

    editingRowId = rowElement.getAttribute('data-id');
    let fieldsHtml = "";

    headers.forEach((header, i) => {
        fieldsHtml += `
            <div style="margin-bottom:10px;">
                <label style="font-size:10px; color:var(--text-muted);">${header}</label>
                <input type="text" value="${cells[i] || ""}" data-index="${i}" class="range-input" style="height:36px; margin-top:2px;">
            </div>
        `;
    });

    document.getElementById('edit-fields').innerHTML = fieldsHtml;
    document.getElementById('edit-modal').style.display = "flex";
}

function closeEditModal() { document.getElementById('edit-modal').style.display = "none"; }

async function saveEdit() {
    if (!editingRowId) return;
    const inputs = document.querySelectorAll('#edit-fields input');
    const updatedRow = Array.from(inputs).map(input => input.value);
    setProcessing(true, "UPDATING...");

    try {
        await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'updateRow', id: editingRowId, values: updatedRow, token: sessionStorage.getItem("session_token")
            })
        });
        closeEditModal();
        setTimeout(() => syncAllData(true), 1200);
    } catch (e) { setProcessing(false); }
}

function showLogoutScreen() {
    toggleDashboard(true);
    resetDashboardToZero();
    document.getElementById('table-toolbar-controls').style.display = 'none';
    document.getElementById('vault-toolbar-controls').style.display = 'none';
    document.getElementById('status').innerText = "System Locked // Awaiting Auth";
    clearDisplayArea();
    document.getElementById('displayArea').innerHTML += `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 16px; text-align:center;">
            <div style="font-size:32px; margin-bottom:8px;">🔐</div>
            <h4 style="color:var(--primary); letter-spacing:2px; margin:0 0 6px 0; font-size:12px; font-weight:800;">ENCRYPTED TERMINAL</h4>
            <p style="color:var(--text-muted); font-size:10px; margin-bottom:16px;">Connection secure. Tap below to authenticate.</p>
            <button class="btn-login" onclick="startAuthSequence()">
                INITIALIZE LOGIN
            </button>
        </div>
    `;
}


function logout() {
    sessionStorage.clear();
    showLogoutScreen();
}
