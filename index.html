<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Finance Command Center | Mobile v4.6</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #030712;
            --surface: rgba(15, 23, 42, 0.85);
            --surface-bright: rgba(30, 41, 59, 0.9);
            --primary: #0ea5e9;
            --primary-glow: rgba(14, 165, 233, 0.3);
            --success: #10b981;
            --danger: #f43f5e;
            --gold: #f59e0b;
            --ledger: #8b5cf6;
            --ledger-glow: rgba(139, 92, 246, 0.4);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            --glass-blur: blur(16px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #030712 100%);
            color: var(--text);
            margin: 0;
            padding: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px) 8px;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        body::after {
            content: ""; position: fixed; inset: 0;
            background: repeating-linear-gradient(transparent, transparent 2px, rgba(255,255,255,0.015) 3px);
            pointer-events: none; z-index: 100;
        }

        .bg-grid {
            position: fixed; inset: 0; z-index: -2;
            background-image: linear-gradient(rgba(14,165,233,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(14,165,233,0.04) 1px, transparent 1px);
            background-size: 30px 30px; animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 30px 30px; } }

        .container { 
            width: 100%; 
            max-width: 100%; 
            height: 100%;
            margin: 0 auto; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            text-align: center;
            color: var(--primary);
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(14,165,233,0.5);
            flex-shrink: 0;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
            transition: all 0.3s ease-in-out;
            flex-shrink: 0;
        }

        .stat-card {
            position: relative;
            background: var(--surface);
            backdrop-filter: var(--glass-blur);
            border-radius: 16px;
            border: 1px solid rgba(14,165,233,0.25);
            padding: 14px;
            overflow: hidden;
        }

        .stat-card .label {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-card .value {
            font-size: 20px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
        }

        #cash-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .denom-tile {
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid var(--border);
        }

        .denom-tile[data-v="500"], .denom-tile[data-v="200"], .denom-tile[data-v="100"] { border-color: rgba(251, 191, 36, 0.6); }
        .denom-value { color: #a2b4f9; font-weight: 600; font-size: 10px; }
        .denom-count { color: var(--text); font-weight: 800; }

        .toolbar {
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            flex-shrink: 0;
        }

        .toolbar-row { display: flex; gap: 6px; width: 100%; align-items: center; }
        .sheet-selector { position: relative; flex: 1; }
        
        .sheet-selector-trigger {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(14,165,233,0.4);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text);
            height: 42px;
        }

        .sheet-selector-dropdown {
            position: absolute; top: 110%; left: 0; right: 0;
            background: rgba(15,23,42,0.98);
            backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 14px;
            padding: 10px;
            display: none; z-index: 3000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .sheet-selector.open .sheet-selector-dropdown { display: block; }
        .sheet-options { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .sheet-option { padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,0.04); font-size: 12px; color: var(--text); }
        .sheet-option.active { background: var(--primary); color: var(--bg); font-weight: 800; }

        .range-input {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 10px;
            border-radius: 12px;
            font-size: 11px;
            height: 42px;
            width: 100%;
            text-align: center;
        }

        .btn-future {
            padding: 8px 10px;
            font-weight: 700;
            font-size: 11px;
            border-radius: 12px;
            border: 1px solid var(--primary);
            background: rgba(14,165,233,0.12);
            color: var(--primary);
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
            white-space: nowrap;
        }

        .btn-future-danger {
            padding: 8px 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 11px;
            color: var(--danger);
            background: rgba(244,63,94,0.12);
            border: 1px solid var(--danger);
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .btn-login {
            padding: 8px 20px;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 1.5px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            background: linear-gradient(135deg, rgba(14,165,233,0.25), rgba(14,165,233,0.05));
            color: var(--primary);
            height: 36px;
            width: auto;
            min-width: 140px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.25);
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .btn-login:active {
            transform: scale(0.96);
            background: var(--primary);
            color: var(--bg);
        }

        .search-row { display: flex; gap: 6px; align-items: center; width: 100%; }

        #tableFilter {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            color: white;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            height: 38px;
        }

        .metrics-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; width: 100%; }
        .metric-pill { background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
        .pill-label { font-size: 8px; color: var(--text-muted); text-transform: uppercase; display: block; }
        .pill-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; }

        #displayArea {
            flex: 1;
            min-height: 0;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sheet-card {
            background: var(--surface);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .table-wrap {
            overflow-x: auto;
            overflow-y: auto;
            width: 100%;
            height: 95%;
            -webkit-overflow-scrolling: touch;
            flex: 1;
            padding-bottom:50px;
        }

        .vault-card-wrap {
            overflow-y: auto;
            width: 100%;
            height: 100%;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
            flex: 1;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            table-layout: auto;
            white-space: nowrap;
        }

        th {
            position: sticky; top: 0; z-index: 20;
            background: #111827 !important;
            padding: 12px 10px;
            font-size: 11px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        td {
            padding: 12px 10px;
            font-size: 12px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .data-row.selected { background: rgba(14, 165, 233, 0.2) !important; }
        .id-badge { font-family: 'JetBrains Mono'; font-size: 9px; background: rgba(14, 165, 233, 0.15); color: var(--primary); padding: 4px 8px; border-radius: 4px; }

        .filter-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(12px);
            z-index: 999999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .filter-modal-backdrop.open { display: flex; }

        .filter-modal-content {
            background: #0f172a;
            border: 1px solid var(--primary);
            border-radius: 18px;
            width: 100%;
            max-width: 360px;
            padding: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-options-container {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-option {
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-option.selected {
            background: var(--primary);
            color: var(--bg);
            font-weight: 800;
            border-color: var(--primary);
        }

        .filter-option.selected::after { content: "✓"; font-size: 11px; }

        #custom-context-menu {
            position: fixed; display: none; bottom: 0; left: 0; right: 0; top: auto !important;
            z-index: 100000;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(25px);
            border-top: 1px solid var(--primary);
            border-radius: 20px 20px 0 0;
            padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px) 16px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .menu-item {
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-item.danger { color: var(--danger); }

        #processing-overlay {
            display: none; position: fixed; inset: 0; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(10px); z-index: 9999999;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .spinner { width: 44px; height: 44px; border: 3px solid transparent; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .card-grid { 
            display: flex; 
            flex-direction: column; 
              gap: 16px; 
            padding: 16px 2px calc(env(safe-area-inset-bottom) + 40px) 2px; 
        }
        .card-grid .fin-panel:last-child { margin-bottom: 0; }
        .fin-panel { background: rgba(15,23,42,0.85); border-radius: 14px; padding: 15px 13px; border: 1px solid rgba(14,165,233,0.2); }
 /* --- 3-PIE / DONUT DASHBOARD STYLING --- */
.chart-dashboard {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 24px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1;
}

.chart-card {
    background: var(--surface);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    position: relative;
}

.chart-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.chart-title {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    text-transform: uppercase;
}

.chart-wrapper-pie {
    position: relative;
    width: 100%;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chart-center-metric {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
}

.chart-center-label {
    font-size: 8px;
    color: var(--text-muted);
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.chart-center-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 800;
    color: var(--danger);
}

.month-select-dropdown {
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid var(--primary);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 8px;
    outline: none;
    cursor: pointer;
}

.month-select-dropdown option {
    background: #0f172a;
    color: var(--text);
}
/* --- CUSTOM THEME MONTH SELECTOR --- */
.custom-select-wrapper {
    position: relative;
    display: inline-block;
    user-select: none;
}

.custom-select-trigger {
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid var(--primary);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 0 10px rgba(14, 165, 233, 0.15);
}

.custom-select-trigger::after {
    content: "▼";
    font-size: 8px;
    color: var(--primary);
}

.custom-options {
    position: absolute;
    top: 115%;
    right: 0;
    background: #0f172a;
    border: 1px solid var(--primary);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    display: none;
    flex-direction: column;
    gap: 4px;
    padding: 6px;
    z-index: 1000;
    min-width: 130px;
    max-height: 200px;
    overflow-y: auto;
}

.custom-select-wrapper.open .custom-options {
    display: flex;
}

.custom-option {
    padding: 8px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.custom-option:hover, .custom-option.selected {
    background: rgba(14, 165, 233, 0.2);
    color: var(--primary);
    font-weight: 700;
}

    </style>
</head>
<body>
    <div class="bg-grid"></div>

    <div id="processing-overlay">
        <div class="spinner"></div>
        <div id="overlay-text" style="margin-top:16px; font-weight: 800; letter-spacing: 2px; font-size:12px; color: var(--primary);">SYSTEM LOADING...</div>
    </div>

    <div class="container">
        <div id="status">System Online // Vijayawada Mobile Node</div>

        <div class="dashboard">
            <div class="stat-card" onclick="viewNamedRange('Savings')">
                <span class="label">Liquidity</span>
                <div class="value" style="color: var(--success);" id="net-val">₹0</div>
            </div>
            <div class="stat-card" onclick="viewNamedRange('CC')">
                <span class="label">Credit Exposure</span>
                <div class="value" style="color: var(--danger);" id="debt-val">₹0</div>
            </div>
            <div class="stat-card">
                <span class="label">Net Position</span>
                <div class="value" style="color: var(--primary);" id="total-available">₹0</div>
            </div>
            <div class="stat-card">
                <span class="label">Cash Assets <span id="cash-total" style="color:var(--gold);">₹0</span></span>
                <div id="cash-grid"></div>
            </div>
        </div>

        <div class="toolbar">
            <!-- ROW 1: MODULE SELECTOR & LOGOUT -->
            <div class="toolbar-row">
                <div class="sheet-selector" id="sheetSelector">
                    <div class="sheet-selector-trigger" onclick="toggleSheetDropdown(event)">
                        <span id="selectedSheetLabel">📄 Select Module</span>
                        <span>▼</span>
                    </div>
                    <div class="sheet-selector-dropdown">
                        <div id="sheetOptionsContainer" class="sheet-options"></div>
                    </div>
                </div>

                <button class="btn-future-danger" onclick="logout()" style="height: 42px; flex: 0.5; border-radius: 12px;">
                    🔐 Logout
                </button>
            </div>

            <!-- ROW 2: FLATPICKR, SEARCH & SYNC -->
            <div class="toolbar-row">
                <input type="text" id="dateRange" class="range-input" placeholder="📅 Date Range" readonly style="flex: 1.4; min-width: 0;">
                <button class="btn-future" onclick="loadMain()" style="flex: 0.8; height: 42px;">Search</button>
                <button class="btn-future" onclick="syncAllData(true)" style="border-color: var(--success); color: var(--success); flex: 0.8; height: 42px;">
                    🔄 Sync
                </button>
            </div>

            <!-- DYNAMIC VAULT HEADER ATTACHED DIRECTLY TO TOOLBAR -->
            <div id="vault-toolbar-controls" style="display: none; justify-content: space-between; align-items: center; width: 100%; border-top: 1px solid var(--border); padding-top: 8px;">
                <button class="btn-future" onclick="returnToDashboard()" style="height:36px; padding:0 12px; width:auto; border-color:var(--primary); flex:none;">
                    ← Back to Dashboard
                </button>
                <div id="vault-toolbar-title" style="font-size:11px; font-weight:800; color:var(--primary); font-family:'JetBrains Mono';">
                    VAULT VIEW
                </div>
            </div>

            <!-- TABLE SEARCH BAR & METRICS (FIXED INSIDE TOOLBAR) -->
            <div id="table-toolbar-controls" style="display: none; flex-direction: column; gap: 8px; width: 100%; border-top: 1px solid var(--border); padding-top: 8px;">
                <div class="search-row">
                    <button class="btn-future" onclick="handleTableBack()" style="height:38px; flex:none; padding:0 10px; border-color:var(--primary);">
                        ← Dash
                    </button>
                    <input type="text" id="tableFilter" placeholder="Search transactions..." onkeyup="applyFilters()">
                    <button class="btn-future-danger" style="height:38px; width:55px; padding:0;" onclick="exitTraceView()">RESET</button>
                </div>
                <div class="metrics-bar">
                    <div class="metric-pill">
                        <span class="pill-label">Inflow</span>
                        <span class="pill-val" id="bar-inflow" style="color:var(--success);">₹0</span>
                    </div>
                    <div class="metric-pill">
                        <span class="pill-label">Outflow</span>
                        <span class="pill-val" id="bar-outflow" style="color:var(--danger);">₹0</span>
                    </div>
                </div>
            </div>
            <!-- TRACE TOOLBAR (ONLY BACK & LOGOUT) -->
<div id="trace-toolbar-controls" style="display: none; justify-content: space-between; align-items: center; width: 100%;">
    <button class="btn-future" onclick="exitTraceView()" style="height: 38px; flex: none; padding: 0 14px;">
        ← Back
    </button>
    <button class="btn-future-danger" onclick="logout()" style="height: 38px; flex: none; padding: 0 14px; border-radius: 12px;">
        🔐 Logout
    </button>
</div>

        </div>

<div id="displayArea"></div>

    <div id="global-filter-modal" class="filter-modal-backdrop" onclick="closeFilterModal(event)">
        <div class="filter-modal-content" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="filter-modal-title" style="font-size:12px; font-weight:800; color:var(--primary); text-transform:uppercase;">Filter Column</span>
                <button onclick="closeFilterModal()" style="background:none; border:none; color:var(--text-muted); font-size:16px;">✕</button>
            </div>
            <input type="text" id="filter-search-input" class="range-input" style="height:36px;" placeholder="Search options..." onkeyup="filterColumnOptions(this.value)">
            <div id="modal-options-container" class="filter-options-container"></div>
            <div style="display:flex; gap:6px; margin-top:6px;">
                <button class="btn-future" style="height:36px; font-size:10px;" onclick="selectAllModalOptions()">SELECT ALL</button>
                <button class="btn-future" style="height:36px; font-size:10px;" onclick="confirmModalFilter()">APPLY</button>
                <button class="btn-future-danger" style="height:36px; font-size:10px;" onclick="clearModalFilter()">CLEAR</button>
            </div>
        </div>
    </div>

    <div id="custom-context-menu"></div>

    <div id="edit-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); z-index:200000; padding:20px; align-items:center; justify-content:center;">
        <div style="background:#0f172a; padding:20px; border-radius:20px; width:100%; max-height:85vh; overflow-y:auto; border:1px solid var(--primary);">
            <h3 style="margin-top:0; font-size:16px;">✏️ Edit Record</h3>
            <div id="edit-fields"></div>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
                <button class="btn-future-danger" onclick="closeEditModal()">Cancel</button>
                <button class="btn-future" onclick="saveEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="otp-modal" style="display:none; position:fixed; inset:0; background:rgba(3,7,18,0.95); backdrop-filter:blur(15px); z-index:300000; align-items:center; justify-content:center; padding:20px;">
        <div class="stat-card" style="width:100%; max-width:320px; text-align:center; border: 1px solid var(--primary);">
            <div style="font-size:32px; margin-bottom:8px;">🛡️</div>
            <h2 style="letter-spacing:2px; font-size:12px; color:var(--primary); margin-bottom:10px;">SECURITY CHALLENGE</h2>
            <p style="font-size:10px; color:var(--text-muted); margin-bottom:16px;">ENTER TELEGRAM AUTHORIZATION KEY</p>
            <input type="tel" id="otp-input" maxlength="6" placeholder="000000" inputmode="numeric" style="width:100%; background:rgba(0,0,0,0.6); border: 1px solid rgba(14,165,233,0.4); border-radius:10px; padding:12px; color:var(--primary); font-family:'JetBrains Mono'; font-size:22px; text-align:center; letter-spacing:6px; outline:none; margin-bottom:20px;">
            <div style="display:flex; gap:10px;">
                <button class="btn-future-danger" style="flex:1;" onclick="closeOtpModal()">ABORT</button>
                <button class="btn-future" style="flex:1;" onclick="submitOtp()">VERIFY</button>
            </div>
        </div>
    </div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxMoMIKcjc0GHe59XS3cZzZZnKHY_iphv3J2YcyREf3C--zI7OF0ItQ7hCn4idFKUJeIw/exec';
let otpVerifying = false;
let currentTableMode = 'statement';
let selectedStart = "";
let selectedEnd = "";
let globalRawHeaders = [];
let globalRawRows = [];
let activeFilters = {};
let activeModalField = null;
let globalDataCache = null;
let activeVaultType = null; 
let currentExpenseChart = null;
let currentPurposeChart = null;
let currentEntityChart = null;
let editingRowId = null;
let activeOverviewMonthKey = null; // Format: "YYYY-MM" (e.g., "2026-08")

function changeOverviewMonth(monthKey) {
    activeOverviewMonthKey = monthKey;
    renderHomeOverview();
}

function toggleSliceVisibility(chartName, index, el) {
    let chart = null;
    if (chartName === 'expense') chart = currentExpenseChart;
    else if (chartName === 'purpose') chart = currentPurposeChart;
    else if (chartName === 'spentFor') chart = currentEntityChart;

    if (!chart) return;

    const isVisible = chart.getDataVisibility(index);
    chart.toggleDataVisibility(index);
    chart.update();

    if (isVisible) {
        el.style.opacity = '0.35';
        const textSpan = el.querySelector('.legend-label-text');
        if (textSpan) textSpan.style.textDecoration = 'line-through';
    } else {
        el.style.opacity = '1';
        const textSpan = el.querySelector('.legend-label-text');
        if (textSpan) textSpan.style.textDecoration = 'none';
    }
}

function renderHomeOverview() {
    if (!globalDataCache) return;

    const monthlySheet = globalDataCache?.sheets?.["Monthly Transaction"];
    if (!monthlySheet || !monthlySheet.rows) return;

    const headers = monthlySheet.headers;
    const rows = monthlySheet.rows;

    // Resolve column indices
    const dateIdx = headers.findIndex(h => /date/i.test(h));
    const modeIdx = headers.findIndex(h => /transaction type|^type$|^mode$/i.test(h));
    const purposeIdx = headers.findIndex(h => /^purpose$|purpose|reason|category/i.test(h));
    const spentForIdx = headers.findIndex(h => /spent for|earned by|spent_for|party|beneficiary/i.test(h));
    const withdrawnIdx = headers.findIndex(h => /withdrawn amount|withdrawn|debit amount|^debit$/i.test(h));
    const depositIdx = headers.findIndex(h => /deposit amount|deposit|credit amount|^credit$/i.test(h));

    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const now = new Date();
    const currentActualYear = now.getFullYear();
    const currentActualMonth = now.getMonth();

    // Helper: Normalize names to Title Case to merge duplicates
    const normalizeLabel = (str) => {
        if (!str) return "";
        return str.toString().trim().toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
    };

    // Gather available months from data
    const availableMonthsMap = new Map();
    rows.forEach(r => {
        const rowTime = parseDateValue(r[dateIdx]);
        if (rowTime) {
            const d = new Date(rowTime);
            const y = d.getFullYear();
            const m = d.getMonth();
            const key = `${y}-${String(m + 1).padStart(2, '0')}`;
            if (!availableMonthsMap.has(key)) {
                availableMonthsMap.set(key, { year: y, month: m, label: `${monthNames[m]} ${y}` });
            }
        }
    });

    const currentKey = `${currentActualYear}-${String(currentActualMonth + 1).padStart(2, '0')}`;
    if (!availableMonthsMap.has(currentKey)) {
        availableMonthsMap.set(currentKey, { year: currentActualYear, month: currentActualMonth, label: `${monthNames[currentActualMonth]} ${currentActualYear}` });
    }

    const sortedMonthOptions = Array.from(availableMonthsMap.entries()).sort((a, b) => b[0].localeCompare(a[0]));

    if (!activeOverviewMonthKey || !availableMonthsMap.has(activeOverviewMonthKey)) {
        activeOverviewMonthKey = availableMonthsMap.has(currentKey) ? currentKey : sortedMonthOptions[0][0];
    }

    const selectedTarget = availableMonthsMap.get(activeOverviewMonthKey);
    const selYear = selectedTarget.year;
    const selMonth = selectedTarget.month;

    const isCurrentCalendarMonth = (selYear === currentActualYear && selMonth === currentActualMonth);
    const daysInMonth = new Date(selYear, selMonth + 1, 0).getDate();
    const daysElapsed = isCurrentCalendarMonth ? Math.max(1, now.getDate()) : daysInMonth;

    let totalMonthOutflow = 0;
    let totalMonthInflow = 0;
    const modeAggregates = {};
    const purposeAggregates = {};
    const spentForAggregates = {};

    // Aggregate filtered month data
    rows.forEach(r => {
        const rowTime = parseDateValue(r[dateIdx]);
        if (rowTime) {
            const d = new Date(rowTime);
            if (d.getMonth() === selMonth && d.getFullYear() === selYear) {
                const debit = parseFloat((r[withdrawnIdx] || "0").toString().replace(/[^0-9.-]/g, "")) || 0;
                const credit = parseFloat((r[depositIdx] || "0").toString().replace(/[^0-9.-]/g, "")) || 0;

                const rawMode = (modeIdx !== -1 && r[modeIdx]) ? String(r[modeIdx]).trim().toUpperCase() : "OTHER";
                const mode = rawMode;
                const purpose = (purposeIdx !== -1 && r[purposeIdx]) ? normalizeLabel(r[purposeIdx]) : "General";
                const spentFor = (spentForIdx !== -1 && r[spentForIdx]) ? normalizeLabel(r[spentForIdx]) : "Self / Direct";

                const isExcluded = mode.includes("SELF TRANSFER") || mode.includes("INTERNAL TRANSFER");

                if (credit > 0 && !isExcluded) {
                    totalMonthInflow += credit;
                }

                if (debit > 0 && !isExcluded) {
                    totalMonthOutflow += debit;
                    modeAggregates[mode] = (modeAggregates[mode] || 0) + debit;
                    purposeAggregates[purpose] = (purposeAggregates[purpose] || 0) + debit;
                    spentForAggregates[spentFor] = (spentForAggregates[spentFor] || 0) + debit;
                }
            }
        }
    });

    const netCashflow = totalMonthInflow - totalMonthOutflow;
    const dailyBurn = totalMonthOutflow / daysElapsed;

    // Expanded High-Contrast Palette
    const extendedPalette = [
        '#0ea5e9', '#f43f5e', '#8b5cf6', '#f59e0b', '#10b981', 
        '#ec4899', '#06b6d4', '#84cc16', '#a855f7', '#64748b',
        '#3b82f6', '#ef4444', '#14b8a6', '#eab308', '#6366f1',
        '#d946ef', '#22c55e', '#f97316', '#2dd4bf', '#a3e635'
    ];

    const sortedModes = Object.entries(modeAggregates).sort((a, b) => b[1] - a[1]);
    const modeLabels = sortedModes.map(i => i[0]);
    const modeValues = sortedModes.map(i => i[1]);
    const modeColors = modeLabels.map((_, i) => extendedPalette[i % extendedPalette.length]);

    const sortedPurposes = Object.entries(purposeAggregates).sort((a, b) => b[1] - a[1]);
    const purposeLabels = sortedPurposes.map(i => i[0]);
    const purposeValues = sortedPurposes.map(i => i[1]);
    const purposeColors = purposeLabels.map((_, i) => extendedPalette[(i + 3) % extendedPalette.length]);

    const sortedSpentFor = Object.entries(spentForAggregates).sort((a, b) => b[1] - a[1]);
    const spentForLabels = sortedSpentFor.map(i => i[0]);
    const spentForValues = sortedSpentFor.map(i => i[1]);
    const spentForColors = spentForLabels.map((_, i) => extendedPalette[(i + 7) % extendedPalette.length]);

    // Helper: Generate Interactive Right-Side Legend/List
    const generateRightSideList = (labels, values, colors, chartRefName) => {
        if (!labels.length) return `<div style="font-size:10px; color:var(--text-muted);">No transactions recorded</div>`;
        return labels.map((label, idx) => {
            const val = values[idx];
            const pct = totalMonthOutflow > 0 ? ((val / totalMonthOutflow) * 100).toFixed(1) : 0;
            return `
                <div onclick="toggleSliceVisibility('${chartRefName}', ${idx}, this)" style="display:flex; justify-content:space-between; align-items:center; font-size:10px; padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; transition: opacity 0.2s;">
                    <div style="display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:55%;">
                        <span style="width:8px; height:8px; border-radius:2px; background:${colors[idx]}; flex-shrink:0;"></span>
                        <span class="legend-label-text" style="color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis;">${label}</span>
                    </div>
                    <div style="font-family:'JetBrains Mono'; text-align:right;">
                        <span style="color:var(--text); font-weight:700;">₹${val.toLocaleString('en-IN', {maximumFractionDigits: 0})}</span>
                        <span style="color:var(--text-muted); font-size:8px;">(${pct}%)</span>
                    </div>
                </div>
            `;
        }).join('');
    };

    let html = `
    <div class="chart-dashboard">
        <!-- 4-TILE TELEMETRY GRID -->
        <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:6px;">
            <div class="stat-card" style="padding:10px 8px; text-align:center;">
                <span class="label" style="justify-content:center; font-size:8px;">INFLOW</span>
                <div class="value" style="color:var(--success); font-size:15px;">₹${totalMonthInflow.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
            </div>
            <div class="stat-card" style="padding:10px 8px; text-align:center;">
                <span class="label" style="justify-content:center; font-size:8px;">OUTFLOW</span>
                <div class="value" style="color:var(--danger); font-size:15px;">₹${totalMonthOutflow.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
            </div>
            <div class="stat-card" style="padding:10px 8px; text-align:center;">
                <span class="label" style="justify-content:center; font-size:8px;">NET CASHFLOW</span>
                <div class="value" style="color:${netCashflow >= 0 ? 'var(--primary)' : 'var(--danger)'}; font-size:15px;">
                    ${netCashflow >= 0 ? '+' : ''}₹${netCashflow.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                </div>
            </div>
            <div class="stat-card" style="padding:10px 8px; text-align:center;">
                <span class="label" style="justify-content:center; font-size:8px;">${isCurrentCalendarMonth ? 'DAILY BURN' : 'AVG DAILY SPEND'}</span>
                <div class="value" style="color:var(--gold); font-size:15px;">₹${dailyBurn.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
            </div>
        </div>

        <!-- CHART 1: PAYMENT MODES -->
        <div class="chart-card">
            <div class="chart-card-header">
                <span class="chart-title">1. Payment Modes</span>
                <div class="custom-select-wrapper" onclick="this.classList.toggle('open')">
                    <div class="custom-select-trigger">
                        📅 ${availableMonthsMap.get(activeOverviewMonthKey)?.label || 'Select Month'}
                    </div>
                    <div class="custom-options">
                        ${sortedMonthOptions.map(([key, opt]) => `
                            <div class="custom-option ${key === activeOverviewMonthKey ? 'selected' : ''}" 
                                 onclick="event.stopPropagation(); changeOverviewMonth('${key}'); this.closest('.custom-select-wrapper').classList.remove('open');">
                                📅 ${opt.label}
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
            
            <div style="display:flex; align-items:center; gap:12px; width:100%;">
                <div style="width:130px; height:130px; flex-shrink:0; position:relative;">
                    <canvas id="expenseDonutChart"></canvas>
                </div>
                <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;">
                    <div id="expenseRightMetric" style="background:rgba(0,0,0,0.4); border:1px solid var(--border); border-radius:8px; padding:6px 10px;">
                        <div style="font-size:8px; font-weight:800; color:var(--text-muted); letter-spacing:1px; text-transform:uppercase;">TOTAL AMOUNT</div>
                        <div style="font-size:14px; font-weight:800; font-family:'JetBrains Mono'; color:var(--danger);">₹${totalMonthOutflow.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                    </div>
                    <div style="max-height:85px; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:2px;">
                        ${generateRightSideList(modeLabels, modeValues, modeColors, 'expense')}
                    </div>
                </div>
            </div>
        </div>

        <!-- CHART 2: PURPOSE -->
        <div class="chart-card">
            <div class="chart-card-header">
                <span class="chart-title">2. Outflow By Purpose</span>
                <span style="font-family:'JetBrains Mono'; font-size:10px; color:var(--primary); font-weight:700;">
                    ${purposeLabels.length} Categories
                </span>
            </div>

            <div style="display:flex; align-items:center; gap:12px; width:100%;">
                <div style="width:130px; height:130px; flex-shrink:0; position:relative;">
                    <canvas id="purposeDonutChart"></canvas>
                </div>
                <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;">
                    <div id="purposeRightMetric" style="background:rgba(0,0,0,0.4); border:1px solid var(--border); border-radius:8px; padding:6px 10px;">
                        <div style="font-size:8px; font-weight:800; color:var(--text-muted); letter-spacing:1px; text-transform:uppercase;">TOTAL AMOUNT</div>
                        <div style="font-size:14px; font-weight:800; font-family:'JetBrains Mono'; color:var(--danger);">₹${totalMonthOutflow.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                    </div>
                    <div style="max-height:85px; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:2px;">
                        ${generateRightSideList(purposeLabels, purposeValues, purposeColors, 'purpose')}
                    </div>
                </div>
            </div>
        </div>

        <!-- CHART 3: SPENT FOR / EARNED BY -->
        <div class="chart-card">
            <div class="chart-card-header">
                <span class="chart-title">3. Spent For / Beneficiaries</span>
                <span style="font-family:'JetBrains Mono'; font-size:10px; color:var(--primary); font-weight:700;">
                    ${spentForLabels.length} Entities
                </span>
            </div>

            <div style="display:flex; align-items:center; gap:12px; width:100%;">
                <div style="width:130px; height:130px; flex-shrink:0; position:relative;">
                    <canvas id="spentForDonutChart"></canvas>
                </div>
                <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;">
                    <div id="spentForRightMetric" style="background:rgba(0,0,0,0.4); border:1px solid var(--border); border-radius:8px; padding:6px 10px;">
                        <div style="font-size:8px; font-weight:800; color:var(--text-muted); letter-spacing:1px; text-transform:uppercase;">TOTAL AMOUNT</div>
                        <div style="font-size:14px; font-weight:800; font-family:'JetBrains Mono'; color:var(--danger);">₹${totalMonthOutflow.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                    </div>
                    <div style="max-height:85px; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:2px;">
                        ${generateRightSideList(spentForLabels, spentForValues, spentForColors, 'spentFor')}
                    </div>
                </div>
            </div>
        </div>
    </div>`;

    document.getElementById('displayArea').innerHTML = html;

    const createDoughnutOptions = (labels, values, total, metricDisplayId) => ({
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: 0 },
        cutout: '62%',
        onClick: (event, elements) => {
            const displayEl = document.getElementById(metricDisplayId);
            if (!displayEl) return;

            if (elements.length > 0) {
                const index = elements[0].index;
                const label = labels[index];
                const value = values[index];
                const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                
                displayEl.innerHTML = `
                    <div style="font-size:8px; font-weight:800; color:var(--primary); letter-spacing:1px; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${label} (${percentage}%)</div>
                    <div style="font-size:14px; font-weight:800; font-family:'JetBrains Mono'; color:var(--gold);">₹${value.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                `;
            } else {
                displayEl.innerHTML = `
                    <div style="font-size:8px; font-weight:800; color:var(--text-muted); letter-spacing:1px; text-transform:uppercase;">TOTAL AMOUNT</div>
                    <div style="font-size:14px; font-weight:800; font-family:'JetBrains Mono'; color:var(--danger);">₹${total.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                `;
            }
        },
        plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
        }
    });

    // 1. Chart 1 (Modes)
    const ctx1 = document.getElementById('expenseDonutChart');
    if (ctx1) {
        if (currentExpenseChart) currentExpenseChart.destroy();
        currentExpenseChart = new Chart(ctx1.getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: modeLabels.length ? modeLabels : ['No Data'],
                datasets: [{
                    data: modeValues.length ? modeValues : [1],
                    backgroundColor: modeValues.length ? modeColors : ['rgba(255,255,255,0.06)'],
                    borderColor: '#0f172a',
                    borderWidth: 1.5,
                    hoverOffset: 4
                }]
            },
            options: createDoughnutOptions(modeLabels, modeValues, totalMonthOutflow, 'expenseRightMetric')
        });
    }

    // 2. Chart 2 (Purpose)
    const ctx2 = document.getElementById('purposeDonutChart');
    if (ctx2) {
        if (currentPurposeChart) currentPurposeChart.destroy();
        currentPurposeChart = new Chart(ctx2.getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: purposeLabels.length ? purposeLabels : ['No Data'],
                datasets: [{
                    data: purposeValues.length ? purposeValues : [1],
                    backgroundColor: purposeValues.length ? purposeColors : ['rgba(255,255,255,0.06)'],
                    borderColor: '#0f172a',
                    borderWidth: 1.5,
                    hoverOffset: 4
                }]
            },
            options: createDoughnutOptions(purposeLabels, purposeValues, totalMonthOutflow, 'purposeRightMetric')
        });
    }

    // 3. Chart 3 (Spent For)
    const ctx3 = document.getElementById('spentForDonutChart');
    if (ctx3) {
        if (currentEntityChart) currentEntityChart.destroy();
        currentEntityChart = new Chart(ctx3.getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: spentForLabels.length ? spentForLabels : ['No Data'],
                datasets: [{
                    data: spentForValues.length ? spentForValues : [1],
                    backgroundColor: spentForValues.length ? spentForColors : ['rgba(255,255,255,0.06)'],
                    borderColor: '#0f172a',
                    borderWidth: 1.5,
                    hoverOffset: 4
                }]
            },
            options: createDoughnutOptions(spentForLabels, spentForValues, totalMonthOutflow, 'spentForRightMetric')
        });
    }
}

function handleTableBack() {
    if (activeVaultType) {
        viewNamedRange(activeVaultType);
    } else {
        returnToDashboard(); 
    }
}

function exitTraceView() {
    document.getElementById('trace-toolbar-controls').style.display = 'none';
    if (globalRawHeaders.length > 0 && globalRawRows.length > 0) {
        renderTable(globalRawHeaders, globalRawRows); // Restores the previous table view
    } else if (activeVaultType) {
        viewNamedRange(activeVaultType);
    } else {
        returnToDashboard();
    }
}

function toggleDashboard(show) {
    const dash = document.querySelector('.dashboard');
    if (dash) dash.style.display = show ? 'grid' : 'none';
}

function resetDashboardToZero() {
    globalDataCache = null;
    try { localStorage.removeItem("finance_data_cache_v3"); } catch(e) {}

    const liquidityCard = document.querySelector(".dashboard .stat-card:nth-child(1)");
    if (liquidityCard) {
        liquidityCard.innerHTML = `
            <span class="label">LIQUIDITY</span>
            <div class="value" style="color:var(--success);" id="net-val">₹0</div>
            <div style="margin-top:6px; font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono';">OPENING: ₹0</div>
        `;
    }

    const creditCard = document.querySelector(".dashboard .stat-card:nth-child(2)");
    if (creditCard) {
        creditCard.innerHTML = `
            <span class="label">CREDIT LIMIT</span>
            <div class="value" style="color:var(--gold);">₹0</div>
            <div style="display:flex; justify-content:space-between; margin-top:6px; font-size:9px; font-family:'JetBrains Mono';">
                <span style="color:var(--danger)">USED: ₹0</span>
                <span style="color:var(--success)">AVL: ₹0</span>
            </div>
        `;
    }

    const netEl = document.getElementById('total-available');
    if (netEl) {
        netEl.innerText = '₹0';
        netEl.style.color = 'var(--primary)';
    }

    const cashTotal = document.getElementById('cash-total');
    if (cashTotal) cashTotal.innerText = '₹0';

    const cashGrid = document.getElementById('cash-grid');
    if (cashGrid) cashGrid.innerHTML = '';
}

function returnToDashboard() {
    activeVaultType = null;
    toggleDashboard(true);
    document.querySelectorAll('.toolbar-row').forEach(row => row.style.display = 'flex');

function normalizeValue(val) {
    return (val ?? "").toString().toLowerCase().replace(/[₹,\s]/g, '').split('.')[0].trim();
}

function parseDateValue(val) {
    if (!val) return 0;
    const cleaned = val.toString().trim();
    let d = new Date(cleaned);
    if (!isNaN(d)) return d.getTime();

    const parts = cleaned.split("-");
    if (parts.length === 3) {
        const months = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
        const day = parseInt(parts[0], 10);
        const month = months[parts[1]];
        const year = parseInt(parts[2], 10);
        if (!isNaN(day) && month !== undefined && !isNaN(year)) return new Date(year, month, day).getTime();
    }
    return 0;
}

const getAuthParams = () => `&token=${sessionStorage.getItem("session_token")}&_cb=${Date.now()}`;

async function syncAllData(forceRefresh = false) {
    if (forceRefresh) {
        await forceAppReload();
        return;
    }

    if (!forceRefresh) {
        const cached = localStorage.getItem("finance_data_cache_v3");
        if (cached) {
            try {
                globalDataCache = JSON.parse(cached);
                return true;
            } catch (e) {
                console.warn("Cache corrupted");
            }
        }
    }

    setProcessing(true, "SYNCING LEDGER...");
    try {
        const res = await fetch(`${SCRIPT_URL}?action=fetchAllData${getAuthParams()}`);
        const data = await res.json();
        globalDataCache = data;
        
        try { localStorage.setItem("finance_data_cache_v3", JSON.stringify(data)); } catch (e) {}

        setProcessing(false);
        document.getElementById('status').innerText = "SYSTEM_ONLINE // MOBILE_SYNCED";
        return true;
    } catch (e) {
        setProcessing(false);
        document.getElementById('status').innerText = "NODE_OFFLINE: SYNC FAILED";
        return false;
    }
}


function filterRowsLocallyByDate(headers, rows, startStr, endStr) {
    if (!startStr) return rows;
    const dateIndex = headers.findIndex(h => /date/i.test(h));
    if (dateIndex === -1) return rows;

    const sTime = new Date(startStr).setHours(0, 0, 0, 0);
    const targetEnd = endStr ? endStr : startStr;
    const eTime = new Date(targetEnd).setHours(23, 59, 59, 999);

    return rows.filter(row => {
        const rowTime = parseDateValue(row[dateIndex]);
        return rowTime >= sTime && rowTime <= eTime;
    });
}

    try {
        // CASE A: Specific Module Selected
        if (selectedSheet !== "") {
            setProcessing(true, `RENDERING ${selectedSheet.toUpperCase()}...`);
            const sheetData = globalDataCache.sheets?.[selectedSheet];
            if (!sheetData || !sheetData.headers) {
                return alert(`Module "${selectedSheet}" not found.`);

            }

            renderTable(sheetData.headers, rowsToRender);
            updateToolbarMetrics(sheetData.headers, rowsToRender);
            return;
        }

        // CASE B: No Module Selected -> Search Master "Full Statement"
        setProcessing(true, "COMPILING STATEMENT...");
        const masterSheet = globalDataCache.sheets?.["Full Statement"] || globalDataCache.sheets?.["Monthly Transaction"];
        if (!masterSheet || !masterSheet.headers) {

        updateToolbarMetrics(masterSheet.headers, rowsToRender);

    } catch (err) {
        console.error("Search compile error:", err);
        alert("Failed to render transactions.");
    } finally {

        setProcessing(false);
    }
}
