<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Finance Command Center | Mobile v4.6</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <style>
        :root {
            --bg: #030712;
            --surface: rgba(15, 23, 42, 0.85);
            --surface-bright: rgba(30, 41, 59, 0.9);
            --primary: #0ea5e9;
            --primary-glow: rgba(14, 165, 233, 0.3);
            --success: #10b981;
            --danger: #f43f5e;
            --gold: #f59e0b;
            --ledger: #8b5cf6;
            --ledger-glow: rgba(139, 92, 246, 0.4);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            --glass-blur: blur(16px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #030712 100%);
            color: var(--text);
            margin: 0;
            padding: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px) 8px;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        body::after {
            content: ""; position: fixed; inset: 0;
            background: repeating-linear-gradient(transparent, transparent 2px, rgba(255,255,255,0.015) 3px);
            pointer-events: none; z-index: 100;
        }

        .bg-grid {
            position: fixed; inset: 0; z-index: -2;
            background-image: linear-gradient(rgba(14,165,233,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(14,165,233,0.04) 1px, transparent 1px);
            background-size: 30px 30px; animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 30px 30px; } }

        .container { 
            width: 100%; 
            max-width: 100%; 
            height: 100%;
            margin: 0 auto; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            text-align: center;
            color: var(--primary);
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(14,165,233,0.5);
            flex-shrink: 0;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
            transition: all 0.3s ease-in-out;
            flex-shrink: 0;
        }

        .stat-card {
            position: relative;
            background: var(--surface);
            backdrop-filter: var(--glass-blur);
            border-radius: 16px;
            border: 1px solid rgba(14,165,233,0.25);
            padding: 14px;
            overflow: hidden;
        }

        .stat-card .label {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-card .value {
            font-size: 20px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
        }

        #cash-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .denom-tile {
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid var(--border);
        }

        .denom-tile[data-v="500"], .denom-tile[data-v="200"], .denom-tile[data-v="100"] { border-color: rgba(251, 191, 36, 0.6); }
        .denom-value { color: #a2b4f9; font-weight: 600; font-size: 10px; }
        .denom-count { color: var(--text); font-weight: 800; }

        .toolbar {
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            flex-shrink: 0;
        }

        .toolbar-row { display: flex; gap: 6px; width: 100%; align-items: center; }
        .sheet-selector { position: relative; flex: 1; }
        
        .sheet-selector-trigger {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(14,165,233,0.4);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text);
            height: 42px;
        }

        .sheet-selector-dropdown {
            position: absolute; top: 110%; left: 0; right: 0;
            background: rgba(15,23,42,0.98);
            backdrop-filter: blur(20px);
            border: 1px solid var(--primary);
            border-radius: 14px;
            padding: 10px;
            display: none; z-index: 3000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .sheet-selector.open .sheet-selector-dropdown { display: block; }
        .sheet-options { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .sheet-option { padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,0.04); font-size: 12px; color: var(--text); }
        .sheet-option.active { background: var(--primary); color: var(--bg); font-weight: 800; }

        .range-input {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 10px;
            border-radius: 12px;
            font-size: 11px;
            height: 42px;
            width: 100%;
            text-align: center;
        }

        .btn-future {
            padding: 8px 10px;
            font-weight: 700;
            font-size: 11px;
            border-radius: 12px;
            border: 1px solid var(--primary);
            background: rgba(14,165,233,0.12);
            color: var(--primary);
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
            white-space: nowrap;
        }

        .btn-future-danger {
            padding: 8px 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 11px;
            color: var(--danger);
            background: rgba(244,63,94,0.12);
            border: 1px solid var(--danger);
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .btn-login {
            padding: 8px 20px;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 1.5px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            background: linear-gradient(135deg, rgba(14,165,233,0.25), rgba(14,165,233,0.05));
            color: var(--primary);
            height: 36px;
            width: auto;
            min-width: 140px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.25);
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .btn-login:active {
            transform: scale(0.96);
            background: var(--primary);
            color: var(--bg);
        }

        .search-row { display: flex; gap: 6px; align-items: center; width: 100%; }

        #tableFilter {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            color: white;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            height: 38px;
        }

        .metrics-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; width: 100%; }
        .metric-pill { background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
        .pill-label { font-size: 8px; color: var(--text-muted); text-transform: uppercase; display: block; }
        .pill-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; }

        #displayArea {
            flex: 1;
            min-height: 0;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #pull-refresh-indicator {
            display: none;
            text-align: center;
            padding: 6px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 1.5px;
            background: rgba(14, 165, 233, 0.1);
            border: 1px dashed rgba(14, 165, 233, 0.4);
            border-radius: 10px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .sheet-card {
            background: var(--surface);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .table-wrap {
            overflow-x: auto;
            overflow-y: auto;
            width: 100%;
            height: 100%;
            -webkit-overflow-scrolling: touch;
            flex: 1;
            padding: 8px;
        }

        .vault-card-wrap {
            overflow-y: auto;
            width: 100%;
            height: 100%;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
            flex: 1;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            table-layout: auto;
            white-space: nowrap;
        }

        th {
            position: sticky; top: 0; z-index: 10;
            background: #111827 !important;
            padding: 12px 10px;
            font-size: 11px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        td {
            padding: 12px 10px;
            font-size: 12px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .data-row.selected { background: rgba(14, 165, 233, 0.2) !important; }
        .id-badge { font-family: 'JetBrains Mono'; font-size: 9px; background: rgba(14, 165, 233, 0.15); color: var(--primary); padding: 4px 8px; border-radius: 4px; }

        .filter-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(12px);
            z-index: 999999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .filter-modal-backdrop.open { display: flex; }

        .filter-modal-content {
            background: #0f172a;
            border: 1px solid var(--primary);
            border-radius: 18px;
            width: 100%;
            max-width: 360px;
            padding: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-options-container {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-option {
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-option.selected {
            background: var(--primary);
            color: var(--bg);
            font-weight: 800;
            border-color: var(--primary);
        }

        .filter-option.selected::after { content: "✓"; font-size: 11px; }

        #custom-context-menu {
            position: fixed; display: none; bottom: 0; left: 0; right: 0; top: auto !important;
            z-index: 100000;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(25px);
            border-top: 1px solid var(--primary);
            border-radius: 20px 20px 0 0;
            padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px) 16px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .menu-item {
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-item.danger { color: var(--danger); }

        #processing-overlay {
            display: none; position: fixed; inset: 0; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(10px); z-index: 9999999;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .spinner { width: 44px; height: 44px; border: 3px solid transparent; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .card-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            padding: 22px 2px calc(env(safe-area-inset-bottom) + 40px) 2px; 
        }
        .card-grid .fin-panel:last-child { margin-bottom: 0; }
        .fin-panel { background: rgba(15,23,42,0.85); border-radius: 14px; padding: 10px 12px; border: 1px solid rgba(14,165,233,0.2); }
    </style>
</head>
<body>
    <div class="bg-grid"></div>

    <div id="processing-overlay">
        <div class="spinner"></div>
        <div id="overlay-text" style="margin-top:16px; font-weight: 800; letter-spacing: 2px; font-size:12px; color: var(--primary);">SYSTEM LOADING...</div>
    </div>

    <div class="container">
        <div id="status">System Online // Vijayawada Mobile Node</div>

        <div class="dashboard">
            <div class="stat-card" onclick="viewNamedRange('Savings')">
                <span class="label">Liquidity</span>
                <div class="value" style="color: var(--success);" id="net-val">₹0</div>
            </div>
            <div class="stat-card" onclick="viewNamedRange('CC')">
                <span class="label">Credit Exposure</span>
                <div class="value" style="color: var(--danger);" id="debt-val">₹0</div>
            </div>
            <div class="stat-card">
                <span class="label">Net Position</span>
                <div class="value" style="color: var(--primary);" id="total-available">₹0</div>
            </div>
            <div class="stat-card">
                <span class="label">Cash Assets <span id="cash-total" style="color:var(--gold);">₹0</span></span>
                <div id="cash-grid"></div>
            </div>
        </div>

        <div class="toolbar">
            <!-- ROW 1: MODULE SELECTOR & LOGOUT -->
            <div class="toolbar-row">
                <div class="sheet-selector" id="sheetSelector">
                    <div class="sheet-selector-trigger" onclick="toggleSheetDropdown(event)">
                        <span id="selectedSheetLabel">📄 Select Module</span>
                        <span>▼</span>
                    </div>
                    <div class="sheet-selector-dropdown">
                        <div id="sheetOptionsContainer" class="sheet-options"></div>
                    </div>
                </div>

                <button class="btn-future-danger" onclick="logout()" style="height: 42px; flex: 0.5; border-radius: 12px;">
                    🔐 Logout
                </button>
            </div>

            <!-- ROW 2: FLATPICKR, SEARCH & SYNC -->
            <div class="toolbar-row">
                <input type="text" id="dateRange" class="range-input" placeholder="📅 Date Range" readonly style="flex: 1.4; min-width: 0;">
                <button class="btn-future" onclick="loadMain()" style="flex: 0.8; height: 42px;">Search</button>
                <button class="btn-future" onclick="syncAllData(true)" style="border-color: var(--success); color: var(--success); flex: 0.8; height: 42px;">
                    🔄 Sync
                </button>
            </div>

            <!-- DYNAMIC VAULT HEADER ATTACHED DIRECTLY TO TOOLBAR -->
            <div id="vault-toolbar-controls" style="display: none; justify-content: space-between; align-items: center; width: 100%; border-top: 1px solid var(--border); padding-top: 8px;">
                <button class="btn-future" onclick="returnToDashboard()" style="height:36px; padding:0 12px; width:auto; border-color:var(--primary); flex:none;">
                    ← Back to Dashboard
                </button>
                <div id="vault-toolbar-title" style="font-size:11px; font-weight:800; color:var(--primary); font-family:'JetBrains Mono';">
                    VAULT VIEW
                </div>
            </div>

            <!-- TABLE SEARCH BAR & METRICS (FIXED INSIDE TOOLBAR) -->
            <div id="table-toolbar-controls" style="display: none; flex-direction: column; gap: 8px; width: 100%; border-top: 1px solid var(--border); padding-top: 8px;">
                <div class="search-row">
                    <button class="btn-future" onclick="returnToDashboard()" style="height:38px; flex:none; padding:0 10px; border-color:var(--primary);">
                        ← Dash
                    </button>
                    <input type="text" id="tableFilter" placeholder="Search transactions..." onkeyup="applyFilters()">
                    <button class="btn-future-danger" style="height:38px; width:55px; padding:0;" onclick="resetAllFilters()">RESET</button>
                </div>
                <div class="metrics-bar">
                    <div class="metric-pill">
                        <span class="pill-label">Inflow</span>
                        <span class="pill-val" id="bar-inflow" style="color:var(--success);">₹0</span>
                    </div>
                    <div class="metric-pill">
                        <span class="pill-label">Outflow</span>
                        <span class="pill-val" id="bar-outflow" style="color:var(--danger);">₹0</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="displayArea">
            <div id="pull-refresh-indicator">↓ PULL DOWN TO REFRESH</div>
        </div>
    </div>

    <div id="global-filter-modal" class="filter-modal-backdrop" onclick="closeFilterModal(event)">
        <div class="filter-modal-content" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="filter-modal-title" style="font-size:12px; font-weight:800; color:var(--primary); text-transform:uppercase;">Filter Column</span>
                <button onclick="closeFilterModal()" style="background:none; border:none; color:var(--text-muted); font-size:16px;">✕</button>
            </div>
            <input type="text" id="filter-search-input" class="range-input" style="height:36px;" placeholder="Search options..." onkeyup="filterColumnOptions(this.value)">
            <div id="modal-options-container" class="filter-options-container"></div>
            <div style="display:flex; gap:6px; margin-top:6px;">
                <button class="btn-future" style="height:36px; font-size:10px;" onclick="selectAllModalOptions()">SELECT ALL</button>
                <button class="btn-future" style="height:36px; font-size:10px;" onclick="confirmModalFilter()">APPLY</button>
                <button class="btn-future-danger" style="height:36px; font-size:10px;" onclick="clearModalFilter()">CLEAR</button>
            </div>
        </div>
    </div>

    <div id="custom-context-menu"></div>

    <div id="edit-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); z-index:200000; padding:20px; align-items:center; justify-content:center;">
        <div style="background:#0f172a; padding:20px; border-radius:20px; width:100%; max-height:85vh; overflow-y:auto; border:1px solid var(--primary);">
            <h3 style="margin-top:0; font-size:16px;">✏️ Edit Record</h3>
            <div id="edit-fields"></div>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
                <button class="btn-future-danger" onclick="closeEditModal()">Cancel</button>
                <button class="btn-future" onclick="saveEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="otp-modal" style="display:none; position:fixed; inset:0; background:rgba(3,7,18,0.95); backdrop-filter:blur(15px); z-index:300000; align-items:center; justify-content:center; padding:20px;">
        <div class="stat-card" style="width:100%; max-width:320px; text-align:center; border: 1px solid var(--primary);">
            <div style="font-size:32px; margin-bottom:8px;">🛡️</div>
            <h2 style="letter-spacing:2px; font-size:12px; color:var(--primary); margin-bottom:10px;">SECURITY CHALLENGE</h2>
            <p style="font-size:10px; color:var(--text-muted); margin-bottom:16px;">ENTER TELEGRAM AUTHORIZATION KEY</p>
            <input type="tel" id="otp-input" maxlength="6" placeholder="000000" inputmode="numeric" style="width:100%; background:rgba(0,0,0,0.6); border: 1px solid rgba(14,165,233,0.4); border-radius:10px; padding:12px; color:var(--primary); font-family:'JetBrains Mono'; font-size:22px; text-align:center; letter-spacing:6px; outline:none; margin-bottom:20px;">
            <div style="display:flex; gap:10px;">
                <button class="btn-future-danger" style="flex:1;" onclick="closeOtpModal()">ABORT</button>
                <button class="btn-future" style="flex:1;" onclick="submitOtp()">VERIFY</button>
            </div>
        </div>
    </div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxMoMIKcjc0GHe59XS3cZzZZnKHY_iphv3J2YcyREf3C--zI7OF0ItQ7hCn4idFKUJeIw/exec';
let otpVerifying = false;
let currentTableMode = 'statement';
let selectedStart = "";
let selectedEnd = "";
let globalRawHeaders = [];
let globalRawRows = [];
let activeFilters = {};
let activeModalField = null;
let globalDataCache = null;

function toggleDashboard(show) {
    const dash = document.querySelector('.dashboard');
    if (dash) dash.style.display = show ? 'grid' : 'none';
}

function resetDashboardToZero() {
    globalDataCache = null;
    try { localStorage.removeItem("finance_data_cache_v3"); } catch(e) {}

    const liquidityCard = document.querySelector(".dashboard .stat-card:nth-child(1)");
    if (liquidityCard) {
        liquidityCard.innerHTML = `
            <span class="label">LIQUIDITY</span>
            <div class="value" style="color:var(--success);" id="net-val">₹0</div>
            <div style="margin-top:6px; font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono';">OPENING: ₹0</div>

function normalizeValue(val) {
    return (val ?? "").toString().toLowerCase().replace(/[₹,\s]/g, '').split('.')[0].trim();
}

function parseDateValue(val) {
    if (!val) return 0;
    const cleaned = val.toString().trim();
    let d = new Date(cleaned);
    if (!isNaN(d)) return d.getTime();

    const parts = cleaned.split("-");
    if (parts.length === 3) {
        const months = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
        const day = parseInt(parts[0], 10);
        const month = months[parts[1]];
        const year = parseInt(parts[2], 10);
        if (!isNaN(day) && month !== undefined && !isNaN(year)) return new Date(year, month, day).getTime();
    }
    return 0;
}

const getAuthParams = () => `&token=${sessionStorage.getItem("session_token")}&_cb=${Date.now()}`;

async function syncAllData(forceRefresh = false) {
    if (!forceRefresh) {
        const cached = localStorage.getItem("finance_data_cache_v3");
        if (cached) {
            try {
                globalDataCache = JSON.parse(cached);
                return true;
            } catch (e) {
                console.warn("Cache corrupted");
            }
        }
    }

    setProcessing(true, "SYNCING LEDGER...");
    try {
        const res = await fetch(`${SCRIPT_URL}?action=fetchAllData${getAuthParams()}`);
        const data = await res.json();
        globalDataCache = data;
        
        try { localStorage.setItem("finance_data_cache_v3", JSON.stringify(data)); } catch (e) {}

        setProcessing(false);
        document.getElementById('status').innerText = "SYSTEM_ONLINE // MOBILE_SYNCED";
        
        if (forceRefresh) {
            initializeDashboard();
            if (selectedSheetName) loadMain();
        }
        return true;
    } catch (e) {
        setProcessing(false);
        document.getElementById('status').innerText = "NODE_OFFLINE: SYNC FAILED";
        return false;
    }
}

function filterRowsLocallyByDate(headers, rows, startStr, endStr) {
    if (!startStr) return rows;
    const dateIndex = headers.findIndex(h => /date/i.test(h));
    if (dateIndex === -1) return rows;

    const sTime = new Date(startStr).setHours(0, 0, 0, 0);
    const targetEnd = endStr ? endStr : startStr;
    const eTime = new Date(targetEnd).setHours(23, 59, 59, 999);

    return rows.filter(row => {
        const rowTime = parseDateValue(row[dateIndex]);
        return rowTime >= sTime && rowTime <= eTime;
    });
}

/* ACCOUNT SELECTION WITH DATE FILTER INTEGRATION */
async function filterLedgerByEntity(type, query) {
    if (!globalDataCache) return;
    currentTableMode = 'statement';
    setProcessing(true, `Filtering ${query}...`);

    try {
        const fullStatementData = globalDataCache.sheets["Full Statement"];
        const ledgerHeaders = fullStatementData.headers;
        
        const transIdx = ledgerHeaders.findIndex(h => h.toLowerCase().includes('transaction'));
        let entityIdx = ledgerHeaders.findIndex(h => h.toLowerCase().includes('from/'));
        if (entityIdx === -1) entityIdx = ledgerHeaders.findIndex(h => h.toLowerCase().includes('account'));
        
        const qLower = query.toLowerCase().trim();
        
        const matchedRows = fullStatementData.rows.filter(row => {
            const transType = transIdx !== -1 && row[transIdx] ? String(row[transIdx]).toLowerCase().trim() : "";
            const entity = entityIdx !== -1 && row[entityIdx] ? String(row[entityIdx]).toLowerCase().trim() : "";

            if (type === "Savings") {
                if (qLower.includes("cash")) return entity.includes("cash");
                const isAllowedTrans = transType.includes("upi") || transType.includes("debit") || transType.includes("net");
                return isAllowedTrans && (entity === qLower);
            } 
            else if (type === "CC") {
                const isCredit = transType.includes("credit");
                if (qLower.includes("hdfc")) return isCredit && entity.includes("hdfc"); 
                if (qLower.includes("icici amazon")) return isCredit && entity.includes("icici amazon");
                if (qLower.includes("icici")) return isCredit && (entity.includes("icici expressions") || entity.includes("icici coral"));
                if (qLower.includes("axis")) return isCredit && (entity.includes("axis flipkart") || entity.includes("axis neo") || entity.includes("axis myzone"));
                return isCredit && (entity === qLower);
            }
            return false;
        });

        const s = selectedStart;
        const e = selectedEnd;

        if (type === "Savings") {
            const openingBalance = await fetchOpeningBalance(query); 
            const sortedRows = sortRowsByDate(ledgerHeaders, matchedRows);
            const enhanced = injectRunningBalance(ledgerHeaders, sortedRows, openingBalance);
            
            let displayRows = enhanced.rows;
            if (s && e) {
                displayRows = filterRowsLocallyByDate(enhanced.headers, displayRows, s, e);
            }
            renderTable(enhanced.headers, displayRows);
            updateToolbarMetrics(enhanced.headers, displayRows);
        } else {
            let displayRows = matchedRows;
            if (s && e) {
                displayRows = filterRowsLocallyByDate(ledgerHeaders, displayRows, s, e);
            }
            renderTable(ledgerHeaders, displayRows);
            updateToolbarMetrics(ledgerHeaders, displayRows);
        }
        setProcessing(false);
    } catch (e) {
        setProcessing(false);
    }
}

async function fetchOpeningBalance(accountName) {
    if (!globalDataCache) return 0;
    const openingsData = globalDataCache.namedRanges.ActualOpenings;
    if (!openingsData) return 0;
    const row = openingsData.rows.find(r => r[0] === accountName);
    return row ? (parseFloat(row[1]) || 0) : 0; 
}

function injectRunningBalance(headers, rows, openingBalance) {
    const depositIdx = headers.findIndex(h => /deposit/i.test(h));
    const withdrawnIdx = headers.findIndex(h => /withdrawn/i.test(h));
    const refIdx = headers.findIndex(h => /reference/i.test(h));

    if (depositIdx === -1 || withdrawnIdx === -1) return { headers, rows };

    let running = openingBalance;
    const newHeaders = [...headers];
    const insertPosition = refIdx !== -1 ? refIdx : depositIdx + 1;
    newHeaders.splice(insertPosition, 0, "Running Balance");

    const newRows = rows.map((row, index) => {
        const deposit = parseFloat((row[depositIdx] || "0").toString().replace(/[^0-9.-]/g, "")) || 0;
        const withdrawn = parseFloat((row[withdrawnIdx] || "0").toString().replace(/[^0-9.-]/g, "")) || 0;
        running = (index === 0 ? openingBalance : running) + deposit - withdrawn;

        const newRow = [...row];
        running = Math.round((running + Number.EPSILON) * 100) / 100;
        newRow.splice(insertPosition, 0, running);
        return newRow;
    });

    return { headers: newHeaders, rows: newRows };
}

function updateToolbarMetrics(headers, rows) {
    const inflowEl = document.getElementById('bar-inflow');
    const outflowEl = document.getElementById('bar-outflow');
    if (!inflowEl || !outflowEl) return;

    let inflow = 0, outflow = 0;
    const headerLower = headers.map(h => h.toLowerCase());
    const inflowIndexes = headerLower.map((h, i) => /deposit|received|credit|incoming/.test(h) ? i : -1).filter(i => i !== -1);
    const outflowIndexes = headerLower.map((h, i) => /withdrawn|given|debit|paid|expense/.test(h) ? i : -1).filter(i => i !== -1);

    rows.forEach(row => {
        inflowIndexes.forEach(i => { inflow += parseFloat((row[i] || "0").toString().replace(/[^0-9.-]/g, "")) || 0; });
        outflowIndexes.forEach(i => { outflow += parseFloat((row[i] || "0").toString().replace(/[^0-9.-]/g, "")) || 0; });
    });

    inflowEl.innerText = formatINR(inflow);
    outflowEl.innerText = formatINR(outflow);
}

function formatTacticalDate(dateStr) {
    if (!dateStr) return "-";
    const date = new Date(dateStr);
    if (isNaN(date)) return dateStr; 
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return `${date.getDate()}-${months[date.getMonth()]}-${date.getFullYear()}`;
}

function sortRowsByDate(headers, rows) {
    const dateIndex = headers.findIndex(h => /date/i.test(h));
    if (dateIndex === -1) return rows;
    return rows.sort((a, b) => parseDateValue(a[dateIndex]) - parseDateValue(b[dateIndex]));
}

function formatINR(value) {
    if (value === null || value === undefined || value === "") return "";
    const num = parseFloat(value.toString().replace(/[^0-9.-]/g, ""));
    if (isNaN(num)) return value;
    return "₹" + num.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderTable(headers, rows) {
    toggleDashboard(false);
    document.getElementById('vault-toolbar-controls').style.display = 'none';
    document.getElementById('table-toolbar-controls').style.display = 'flex';
    document.getElementById('tableFilter').value = "";
    
    activeFilters = {};
    globalRawHeaders = headers; globalRawRows = rows; rows = sortRowsByDate(headers, rows);
    const isRegistry = currentTableMode === 'registry';
    let idColIdx = headers.findIndex(h => /id|ref_id|reference/i.test(h));
    if (idColIdx === -1) idColIdx = headers.length - 1;

    let html = `
    <div id="pull-refresh-indicator">↓ PULL DOWN TO REFRESH</div>
    <div class='sheet-card'>
        <div class='table-wrap' id="tableWrap">
           <table id="mainDataTable">
                <thead>
                    <tr>
                        ${headers.map((h) => {
                            const fieldName = h.toLowerCase().replace(/\s+/g, '_');
                            return `
                            <th onclick="openFilterModal('${fieldName}', '${h}')">
                                ${h} ▼
                            </th>`;
                        }).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${rows.map(row => {
                        const rawId = row[idColIdx];
                        const rowId = rawId ? String(rawId).trim() : "";
                        return `
                        <tr class="data-row" data-id="${rowId}" onclick="handleRowClick(this)">
                            ${row.map((cell, idx) => {
                                const headerName = headers[idx].toLowerCase();
                                const fieldName = headerName.replace(/\s+/g, '_');
                                const isIdCol = idx === idColIdx;
                                const isDate = /date/i.test(headers[idx]);

                                const isInflow = /deposit|received|credit|incoming/.test(headerName);
                                const isOutflow = /withdrawn|given|debit|paid|expense/.test(headerName);
                                const isRunningBalance = headerName.includes("running balance");
                                const isAmount = isInflow || isOutflow || headerName.includes("total") || (headerName.includes("balance") && !isRunningBalance);

                                let content = cell ?? '';
                                if (isAmount) content = formatINR(cell);
                                if (isIdCol && !isRegistry) content = `<span class="id-badge">${cell}</span>`;
                                else if (isDate) content = formatTacticalDate(cell);

                                let amountStyle = "";
                                if (isRunningBalance) amountStyle = "color:var(--ledger); font-weight:800;";
                                else if (isInflow) amountStyle = "color:var(--success); font-weight:700;";
                                else if (isOutflow) amountStyle = "color:var(--danger); font-weight:700;";

                                return `<td data-field="${fieldName}" style="${amountStyle}">${content}</td>`;
                            }).join('')}
                        </tr>`;
                    }).join('')}
                </tbody>
           </table>
        </div>
    </div>`;

    document.getElementById('displayArea').innerHTML = html;
    recalculateMetricsFromVisible();
}

function handleRowClick(rowElement) {
    rowElement.classList.toggle('selected');
    recalculateMetricsFromSelected();
}

function openFilterModal(fieldName, titleName) {
    activeModalField = fieldName;
    document.getElementById('filter-modal-title').innerText = `Filter: ${titleName}`;
    document.getElementById('filter-search-input').value = "";
    
    const colIndex = globalRawHeaders.findIndex(h => h.toLowerCase().replace(/\s+/g, '_') === fieldName);
    const isDateColumn = /date/i.test(globalRawHeaders[colIndex] || "");
    
    const valueSet = new Set();
    if (colIndex !== -1) {
        globalRawRows.forEach(row => {
            let rawValue = (row[colIndex] ?? "").toString().trim();
            if (rawValue !== "") valueSet.add(rawValue);
        });
    }

    const sorted = Array.from(valueSet).sort((a, b) => {
        if (isDateColumn) {
            return parseDateValue(a) - parseDateValue(b);
        }
        if (!isNaN(a) && !isNaN(b)) return parseFloat(a) - parseFloat(b);
        return a.localeCompare(b);
    });

    const selected = activeFilters[fieldName] || [];
    const container = document.getElementById('modal-options-container');
    
    container.innerHTML = sorted.map(val => `
        <div class="filter-option ${selected.includes(normalizeValue(val)) ? 'selected' : ''}" data-value="${val}" onclick="toggleModalOptionChip(this)">
            <span>${val}</span>
        </div>
    `).join('');

    document.getElementById('global-filter-modal').classList.add('open');
}

function closeFilterModal(e) {
    if (!e || e.target.id === 'global-filter-modal' || e.target.tagName === 'BUTTON') {
        document.getElementById('global-filter-modal').classList.remove('open');
    }
}

function filterColumnOptions(query) {
    query = query.toLowerCase().trim();
    const options = document.querySelectorAll('#modal-options-container .filter-option');
    options.forEach(opt => {
        const val = opt.getAttribute('data-value').toLowerCase();
        opt.style.display = (!query || val.includes(query)) ? 'flex' : 'none';
    });
}

function toggleModalOptionChip(element) {
    element.classList.toggle('selected');
}

function selectAllModalOptions() {
    const options = document.querySelectorAll('#modal-options-container .filter-option');
    options.forEach(opt => {
        if (opt.style.display !== 'none') {
            opt.classList.add('selected');
        }
    });
}

function confirmModalFilter() {
    if (!activeModalField) return;
    const selectedChips = document.querySelectorAll('#modal-options-container .filter-option.selected');
    const allChips = document.querySelectorAll('#modal-options-container .filter-option');

    if (selectedChips.length === 0 || selectedChips.length === allChips.length) {
        activeFilters[activeModalField] = [];
    } else {
        activeFilters[activeModalField] = Array.from(selectedChips).map(c => normalizeValue(c.getAttribute('data-value')));
    }

    applyFilters();
    closeFilterModal();
}

function clearModalFilter() {
    if (!activeModalField) return;
    activeFilters[activeModalField] = [];
    applyFilters();
    closeFilterModal();
}

function resetAllFilters() {
    activeFilters = {};
    document.getElementById('tableFilter').value = "";
    applyFilters();
}

function applyFilters() {
    const query = document.getElementById('tableFilter').value.toLowerCase().trim();
    const rows = Array.from(document.querySelectorAll('.data-row'));

    rows.forEach(row => {
        const cells = Array.from(row.querySelectorAll('td'));
        const matchesSearch = !query || cells.some(c => c.textContent.toLowerCase().includes(query));
        let matchesFilters = true;

        for (const field in activeFilters) {
            const selectedValues = activeFilters[field];
            if (!selectedValues || selectedValues.length === 0) continue;
            const cell = row.querySelector(`td[data-field="${field}"]`);
            if (!cell || !selectedValues.includes(normalizeValue(cell.textContent))) {
                matchesFilters = false; break;
            }
        }

        row.style.display = (matchesSearch && matchesFilters) ? "" : "none";
    });

    recalculateMetricsFromVisible();
}

function recalculateMetricsFromVisible() {
    const rows = Array.from(document.querySelectorAll('#mainDataTable tbody tr'));
    let totalInflow = 0, totalOutflow = 0;

    rows.forEach(row => {
        if (row.style.display !== 'none') {
            const inflowCell = row.querySelector('td[style*="color:var(--success)"]');
            const outflowCell = row.querySelector('td[style*="color:var(--danger)"]');
            if (inflowCell) totalInflow += parseFloat(inflowCell.innerText.replace(/[^0-9.-]/g, "")) || 0;
            if (outflowCell) totalOutflow += parseFloat(outflowCell.innerText.replace(/[^0-9.-]/g, "")) || 0;
        }
    });

    document.getElementById('bar-inflow').innerText = formatINR(totalInflow);
    document.getElementById('bar-outflow').innerText = formatINR(totalOutflow);
}

function recalculateMetricsFromSelected() {
    const selectedRows = document.querySelectorAll('.data-row.selected');
    if (selectedRows.length === 0) return recalculateMetricsFromVisible();
    let totalInflow = 0, totalOutflow = 0;

    selectedRows.forEach(row => {
        const inflowCell = row.querySelector('td[style*="color:var(--success)"]');
        const outflowCell = row.querySelector('td[style*="color:var(--danger)"]');
        if (inflowCell) totalInflow += parseFloat(inflowCell.innerText.replace(/[^0-9.-]/g, "")) || 0;
        if (outflowCell) totalOutflow += parseFloat(outflowCell.innerText.replace(/[^0-9.-]/g, "")) || 0;
    });

    document.getElementById('bar-inflow').innerText = formatINR(totalInflow);
    document.getElementById('bar-outflow').innerText = formatINR(totalOutflow);
}

async function fetchAssociated() {
    if (!globalDataCache) return;
    toggleDashboard(false);
    const ids = Array.from(document.querySelectorAll('.data-row.selected')).map(r => r.getAttribute('data-id'));
    if (!ids.length) return;
    setProcessing(true, "TRACING SYSTEM REFERENCES...");

    try {
        let grouped = {};
        for (const [sheetName, data] of Object.entries(globalDataCache.sheets)) {
            const matchedRows = data.rows.filter(row => row.some(cell => ids.includes(String(cell).trim())));
            if (matchedRows.length > 0) {
                grouped[sheetName] = { headers: data.headers, rows: matchedRows };
            }
        }

        let finalHtml = `
            <div style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">
                <button class="btn-future" onclick="loadMain()" style="flex:none; height:36px; padding:0 12px;">
                    ← EXIT TRACE
                </button>
                <div class="metric-pill">
                    <span class="pill-label">TARGETS</span>
                    <span class="pill-val" style="color:var(--primary); font-size:10px;">${ids.join(', ')}</span>
                </div>
            </div>`;
        
        let foundAnyData = false;

        for (const sheetName in grouped) {
            const sheet = grouped[sheetName];
            if (sheet.headers && sheet.rows && sheet.rows.length > 0) {
                foundAnyData = true;
                finalHtml += `
                    <div class="sheet-card" style="margin-bottom:14px;">
                        <div style="padding:10px; background:rgba(14,165,233,0.1); border-bottom:1px solid var(--border); font-size:11px; font-weight:800; color:var(--primary);">
                            MODULE: ${sheetName.toUpperCase()} (${sheet.rows.length})
                        </div>
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>${sheet.headers.map(h => `<th>${h}</th>`).join('')}</tr>
                                </thead>
                                <tbody>
                                    ${sheet.rows.map(r => `
                                        <tr>${r.map((cell, idx) => {
                                                const isDate = /date/i.test(sheet.headers[idx]);
                                                const isAmount = /amount|total|balance|deposit|withdrawn/i.test(sheet.headers[idx]);
                                                return `<td style="${isAmount ? 'font-family:\'JetBrains Mono\'; font-weight:700; color:var(--gold);' : ''}">
                                                            ${isDate ? formatTacticalDate(cell) : (cell ?? "")}
                                                        </td>`;
                                            }).join('')}
                                        </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>`;
            }
        }

        if (!foundAnyData) {
            finalHtml += `<div style="text-align:center; padding:40px; color:var(--text-muted); font-size:12px;">NO ASSOCIATED RECORDS FOUND</div>`;
        }

        document.getElementById('displayArea').innerHTML = finalHtml;
        setProcessing(false);
        document.getElementById('status').innerText = "TRACE_COMPLETE";
        
    } catch(e) { 
        setProcessing(false);
        document.getElementById('status').innerText = "TRACE_ERROR";
    }
}

let longPressTimer;
function showContextMenu(e, rowElement) {
    if (e.cancelable) e.preventDefault();
    if (!rowElement.classList.contains('selected')) {
        document.querySelectorAll('.data-row.selected').forEach(r => r.classList.remove('selected'));
        handleRowClick(rowElement);
    }

    const menu = document.getElementById('custom-context-menu');
    const selectedCount = document.querySelectorAll('.data-row.selected').length;
    
    let menuHtml = ``;
    if (selectedCount === 1) {
        menuHtml += `<div class="menu-item" onclick="executeCommand('copy')">📋 Copy Details</div>
                     <div class="menu-item" onclick="executeCommand('edit')">✏️ Edit Record</div>`;
    }
    menuHtml += `<div class="menu-item" onclick="executeCommand('trace')">🔍 Trace Sequence (${selectedCount})</div>
                 <div class="menu-item danger" onclick="executeCommand('purge')">🔥 Global Purge (${selectedCount})</div>
                 <div class="menu-item" onclick="hideContextMenu()">❌ Cancel</div>`;
    menu.innerHTML = menuHtml;
    menu.style.display = 'block';

    document.addEventListener('click', hideContextMenu);
}

function hideContextMenu() {
    document.getElementById('custom-context-menu').style.display = 'none';
    document.removeEventListener('click', hideContextMenu);
}

async function executeCommand(type) {
    hideContextMenu();
    const selectedRows = document.querySelectorAll('.data-row.selected');
    if (type === 'copy' && selectedRows.length === 1) copyRowToClipboard(selectedRows[0]);
    else if (type === 'edit' && selectedRows.length === 1) openEditModal(selectedRows[0]);
    else if (type === 'trace') fetchAssociated();
    else if (type === 'purge') deleteRecords();
}

document.addEventListener('touchstart', function(e) {
    const row = e.target.closest('.data-row');
    if (row) longPressTimer = setTimeout(() => showContextMenu(e, row), 550);
}, {passive: true});

document.addEventListener('touchend', () => clearTimeout(longPressTimer));
document.addEventListener('touchmove', () => clearTimeout(longPressTimer));

/* DEEP CACHE PURGE & FORCE DEPLOYMENT RELOAD */
async function forceAppReload(indicator) {
    if (indicator) indicator.innerText = 'PURGING CACHE & FETCHING NEW DEPLOYMENT...';
    
    // 1. Clear LocalStorage JSON Cache
    localStorage.removeItem("finance_data_cache_v3");

    // 2. Clear all PWA Cache Storage
    if ('caches' in window) {
        try {
            const keys = await caches.keys();
            await Promise.all(keys.map(key => caches.delete(key)));
        } catch(e) { console.warn("Cache API clear failed:", e); }
    }

    // 3. Unregister active Service Workers so the fresh sw.js & deployment are fetched
    if ('serviceWorker' in navigator) {
        try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let registration of registrations) {
                await registration.unregister();
            }
        } catch(e) { console.warn("ServiceWorker unregister failed:", e); }
    }

    // 4. Force hard reload with timestamp parameter to bypass HTTP browser cache
    const currentUrl = new URL(window.location.href);
    currentUrl.searchParams.set('_v', Date.now());
    window.location.href = currentUrl.toString();
}

/* TOUCH PULL-TO-REFRESH HANDLER FOR MOBILE DEVICES */
let pullStartY = 0;
let pullCurrentY = 0;
let isPullGesture = false;

document.addEventListener('touchstart', function(e) {
    const scrollTarget = document.querySelector('.vault-card-wrap, .table-wrap, #displayArea');
    if (!scrollTarget || scrollTarget.scrollTop <= 0) {
        pullStartY = e.touches[0].clientY;
        isPullGesture = true;
    } else {
        isPullGesture = false;
    }
}, { passive: true });

document.addEventListener('touchmove', function(e) {
    if (!isPullGesture) return;
    const scrollTarget = document.querySelector('.vault-card-wrap, .table-wrap, #displayArea');
    if (scrollTarget && scrollTarget.scrollTop > 0) {
        isPullGesture = false;
        return;
    }
    
    pullCurrentY = e.touches[0].clientY;
    const dist = pullCurrentY - pullStartY;
    const indicator = document.getElementById('pull-refresh-indicator');

    if (indicator && dist > 15) {
        indicator.style.display = 'block';
        if (dist > 65) {
            indicator.innerText = 'RELEASE TO FETCH NEW DEPLOYMENT 🔄';
        } else {
            indicator.innerText = '↓ PULL DOWN TO REFRESH';
        }
    }
}, { passive: true });

document.addEventListener('touchend', function() {
    if (!isPullGesture) return;
    const dist = pullCurrentY - pullStartY;
    const indicator = document.getElementById('pull-refresh-indicator');

    if (dist > 65) {
        forceAppReload(indicator);
    } else if (indicator) {
        indicator.style.display = 'none';
    }
    
    isPullGesture = false;
    pullStartY = 0;
    pullCurrentY = 0;
});

async function copyRowToClipboard(rowElement) {
    const table = document.getElementById('mainDataTable');
    const headers = Array.from(table.querySelectorAll('th')).map(th => th.innerText.replace('▼', '').trim());
    const cells = Array.from(rowElement.querySelectorAll('td')).map(td => td.innerText.trim());

    const getVal = (regex) => {
        const idx = headers.findIndex(h => regex.test(h));
        return idx !== -1 ? cells[idx] : "";
    };

    const date = getVal(/date/i);
    const narration = getVal(/narration/i);
    const spentFor = getVal(/spent for/i);
    const withdrawn = getVal(/withdrawn amount/i).replace(/[^0-9.]/g, "");
    const deposit = getVal(/deposit amount/i).replace(/[^0-9.]/g, "");
    const account = getVal(/from\/ to/i);
    const ref = getVal(/reference/i);

    const isDebit = parseFloat(withdrawn) > 0;
    const amount = isDebit ? withdrawn : deposit;
    const type = isDebit ? "Debit" : "Credit";

    const formattedText = `📅 Date: ${date}\n👤 Name: ${spentFor}\n📝 Msg: ${narration}\n💰 Amount: ${amount}\n⇄ Type: ${type}\n🏢 Account: ${account}\n🔗 Ref: ${ref}`;

    try {
        await navigator.clipboard.writeText(formattedText);
        alert("Copied to clipboard!");
    } catch (err) {
        alert("Copy failed.");
    }
}

async function deleteRecords() {
    const ids = Array.from(document.querySelectorAll('.data-row.selected')).map(r => r.getAttribute('data-id'));
    const token = sessionStorage.getItem("session_token");
    if (!ids.length || !confirm(`PURGE ${ids.length} records?`)) return;

    setProcessing(true, "PURGING...");
    try {
        await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'deleteRows', ids: ids, token: token })
        });
        setTimeout(() => syncAllData(true), 1200);
    } catch(e) { 
        setProcessing(false);
    }
}

function openEditModal(rowElement) {
    const table = document.getElementById('mainDataTable');
    const headers = Array.from(table.querySelectorAll('th')).map(th => th.innerText.replace('▼', '').trim());
    const cells = Array.from(rowElement.querySelectorAll('td')).map(td => td.innerText.trim());

    editingRowId = rowElement.getAttribute('data-id');
    let fieldsHtml = "";

    headers.forEach((header, i) => {
        fieldsHtml += `
            <div style="margin-bottom:10px;">
                <label style="font-size:10px; color:var(--text-muted);">${header}</label>
                <input type="text" value="${cells[i] || ""}" data-index="${i}" class="range-input" style="height:36px; margin-top:2px;">
            </div>
        `;
    });

    document.getElementById('edit-fields').innerHTML = fieldsHtml;
    document.getElementById('edit-modal').style.display = "flex";
}

function closeEditModal() { document.getElementById('edit-modal').style.display = "none"; }

async function saveEdit() {
    if (!editingRowId) return;
    const inputs = document.querySelectorAll('#edit-fields input');
    const updatedRow = Array.from(inputs).map(input => input.value);
    setProcessing(true, "UPDATING...");

    try {
        await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'updateRow', id: editingRowId, values: updatedRow, token: sessionStorage.getItem("session_token")
            })
        });
        closeEditModal();
        setTimeout(() => syncAllData(true), 1200);
    } catch (e) { setProcessing(false); }
}

function showLogoutScreen() {
    toggleDashboard(true);
    resetDashboardToZero();
    document.getElementById('table-toolbar-controls').style.display = 'none';
    document.getElementById('vault-toolbar-controls').style.display = 'none';
    document.getElementById('status').innerText = "System Locked // Awaiting Auth";
    clearDisplayArea();
    document.getElementById('displayArea').innerHTML += `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 16px; text-align:center;">
            <div style="font-size:32px; margin-bottom:8px;">🔐</div>
            <h4 style="color:var(--primary); letter-spacing:2px; margin:0 0 6px 0; font-size:12px; font-weight:800;">ENCRYPTED TERMINAL</h4>
            <p style="color:var(--text-muted); font-size:10px; margin-bottom:16px;">Connection secure. Tap below to authenticate.</p>
            <button class="btn-login" onclick="startAuthSequence()">
                INITIALIZE LOGIN
            </button>
        </div>
    `;
}

function logout() {
    sessionStorage.clear();
    showLogoutScreen();
}
